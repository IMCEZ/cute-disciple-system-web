<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,interactive-widget=resizes-content">
<title>可爱徒弟系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* 主色：现代蓝 + 轻粉点缀 */
  --accent:#5b8def;--accent-light:#7ba6f5;
  --accent-2:#f4a6cc;                       /* 轻粉强调 */
  --accent-gradient:linear-gradient(135deg,#5b8def,#8fb8f8);
  --pink-gradient:linear-gradient(135deg,#f6aecd,#f9c9de);
  --blue-pink-gradient:linear-gradient(135deg,#6f9bf0,#f3a8ce);
  --bg-0:#e8eff9;--bg-1:#eef3fb;--bg-card:#ffffff;
  /* 亮色主题：文字用深色，浮在白玻璃面板上清晰 */
  --text-1:#2a3452;--text-2:#586084;--text-3:#8b93ac;
  --border:rgba(91,141,239,0.14);
  --glass:rgba(255,255,255,0.60);
  /* 玻璃拟态色板（白色系） */
  --glass-1:rgba(255,255,255,0.58);         /* 常规面板 */
  --glass-2:rgba(255,255,255,0.72);         /* 强调面板 */
  --glass-3:rgba(255,255,255,0.42);         /* 弱化底 */
  --glass-border:rgba(255,255,255,0.85);
  --glass-border-soft:rgba(120,150,210,0.22);
  --panel-blur:blur(8px);
  --scrim:rgba(238,243,251,0.55);
}
html{height:100%}
/* 固定背景层：手机端显示用户图片，桌面端柔和白蓝粉渐变 */
#bg-layer{
  position:fixed;inset:0;z-index:-2;
  background:
    linear-gradient(135deg,#eaf1fc 0%,#f3f0fb 45%,#fdeef5 100%);
}
#bg-layer::after{
  content:'';position:absolute;inset:0;
  background:url('assets/bg.jpg') center/cover no-repeat;
  opacity:0.28;
}
#bg-scrim{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 640px at 82% -8%,rgba(122,166,245,0.28),transparent 60%),
    radial-gradient(900px 560px at -8% 108%,rgba(246,174,205,0.26),transparent 58%),
    linear-gradient(180deg,rgba(255,255,255,0.35),rgba(238,243,251,0.55));
}
body{
  font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;
  color:var(--text-1);overflow:hidden;width:100%;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:transparent;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(91,141,239,0.35);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(91,141,239,0.55)}
.ico{display:inline-block;vertical-align:middle;flex-shrink:0}
.startup-logo .ico{color:var(--accent)}
/* SVG 图标在各容器内的对齐 */
.set-group-title{display:flex;align-items:center;gap:6px}
.set-group-title .ico{color:var(--accent)}
.aff-heart{display:flex;align-items:center;justify-content:center;gap:6px}
.aff-heart .ico{color:#f4849f}
.tap-icon .ico{color:var(--accent)}
.set-btn .ico,.startup-btn .ico,.create-cancel .ico,.set-switch-label .ico{vertical-align:-2px}
.kv-val .ico,.portrait-title .ico{vertical-align:-2px;color:var(--accent)}
.msg-avatar .ico,.rec-icon .ico,.item-icon .ico{color:var(--accent)}
.portrait-img .ico{color:var(--accent);opacity:.85}
.l2d-emo-btn .ico{color:var(--text-2)}
.l2d-emo-btn.active .ico{color:var(--accent)}

/* 手机端顶栏 - 玻璃拟态 */
.mobile-topbar{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;height:54px;flex-shrink:0;
  background:var(--glass-2);
  border-bottom:1px solid var(--glass-border-soft);
  box-shadow:0 2px 24px rgba(0,0,0,0.28),inset 0 1px 0 rgba(255,255,255,0.18);
}
.mobile-topbar button{
  width:34px;height:34px;border-radius:12px;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.12);
  border:1px solid var(--glass-border-soft);color:var(--text-1);flex-shrink:0;
  transition:all .2s;
}
.mobile-topbar button:hover{background:rgba(139,125,255,0.3);border-color:var(--accent)}
.mobile-topbar button:active{transform:scale(0.92)}
.mobile-topbar .info{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:11px;color:var(--text-1);
  background:rgba(255,255,255,0.08);
  border:1px solid var(--glass-border-soft);border-radius:14px;
  padding:6px 10px;
}

/* 主容器 */
.app-container{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;overflow:hidden}

/* 场景头标 - 居中胶囊标签 */
.scene-header{
  display:flex;align-items:center;justify-content:center;
  padding:8px 12px;flex-shrink:0;
}
.scene-header span{
  font-size:12px;color:var(--accent);letter-spacing:0.5px;font-weight:600;
  background:rgba(255,255,255,0.92);
  border:1px solid rgba(91,141,239,0.28);
  border-radius:20px;padding:5px 16px;
  box-shadow:0 4px 18px rgba(91,141,239,0.15);
}

/* 内容区 - 沉浸式阅读 */
.narrative-content{
  flex:1;overflow-y:auto;min-height:0;
  padding:8px 20px 20px;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-gutter:stable;
}
.narrative-content>*{max-width:640px;margin-left:auto;margin-right:auto}
.greeting-text,.narrative-body{
  font-family:'Georgia','Songti SC',serif;
  font-size:16px;line-height:2;color:var(--text-1);
  letter-spacing:0.3px;
}
.greeting-text{animation:fadeUp .8s ease both}
.greeting-text:nth-child(2){animation-delay:.15s}
.greeting-text:nth-child(3){animation-delay:.3s}
.narrative-body p{margin-bottom:1em;animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.loading-dots{
  display:flex;gap:8px;padding:16px 0;justify-content:center;
  font-size:15px;color:var(--accent-light);letter-spacing:3px;
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:0.35}50%{opacity:1}}

/* 开始收徒按钮 - 位于叙事区前情下方 */
.intro-btn-wrap{display:flex;justify-content:center;margin-top:28px;animation:fadeUp .8s ease .45s both}
.btn-begin{
  padding:13px 28px;border-radius:28px;border:none;
  background:var(--accent-gradient);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;
  box-shadow:0 6px 24px rgba(108,92,231,0.4);
  transition:all .25s;letter-spacing:0.5px;
}
.btn-begin:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(108,92,231,0.55)}
.btn-begin:active{transform:translateY(0) scale(0.97)}

/* 底部操作区 - 玻璃拟态 */
.bottom-actions{
  display:flex;flex-direction:row;align-items:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  flex-shrink:0;flex-grow:0;min-height:64px;
  background:var(--glass-2);
  border-top:1px solid var(--glass-border-soft);
  box-shadow:0 -2px 28px rgba(0,0,0,0.32),inset 0 1px 0 rgba(255,255,255,0.16);
  position:relative;
}
/* 生成状态条：悬浮在输入框上方，小字 + 上下滑入滑出 */
.gen-status{
  position:absolute;left:50%;bottom:calc(100% - 2px);
  transform:translate(-50%,10px);
  max-width:calc(100% - 32px);
  display:none;align-items:center;gap:7px;
  padding:6px 14px;border-radius:14px 14px 0 0;
  background:rgba(250,251,254,0.96);
  border:1px solid var(--glass-border-soft);border-bottom:none;
  box-shadow:0 -4px 18px rgba(80,110,180,0.14);
  font-size:11px;color:var(--accent);letter-spacing:0.5px;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .28s ease;
}
.gen-status.show{display:flex;opacity:1;transform:translate(-50%,0)}
.gen-status.hide{display:flex;opacity:0;transform:translate(-50%,10px)}
.gen-status .gs-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:gsPulse 1s ease-in-out infinite}
.gen-status.done .gs-dot{animation:none;background:#42b883}
.gen-status.done{color:#42b883}
@keyframes gsPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
.action-input{display:flex;align-items:flex-end;gap:8px;width:100%;max-width:720px;margin:0 auto}
.input-wrapper{
  flex:1;display:flex;align-items:flex-end;gap:6px;
  background:rgba(255,255,255,0.12);
  border-radius:22px;border:1px solid var(--glass-border-soft);
  padding:4px 5px 4px 16px;transition:all .25s;
}
.input-wrapper:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,125,255,0.22);background:rgba(255,255,255,0.16)}
.input-wrapper.locked{opacity:0.4}
.chat-input{
  flex:1;background:transparent;border:none;outline:none;color:var(--text-1);
  font-size:14px;resize:none;padding:8px 0;max-height:96px;line-height:1.5;font-family:inherit;
}
.chat-input::placeholder{color:var(--text-3)}
.btn-send,.btn-icon,.btn-newday{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;transition:all .2s;
}
.btn-send{
  width:38px;height:38px;border:none;
  background:var(--accent-gradient);color:#fff;font-size:15px;
  box-shadow:0 2px 12px rgba(108,92,231,0.45);
}
.btn-send:hover{transform:scale(1.1)}
.btn-send:active{transform:scale(0.9)}
.btn-send:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;transform:none}
.btn-icon,.btn-newday{
  width:40px;height:40px;
  border:1px solid var(--glass-border-soft);background:rgba(255,255,255,0.12);color:var(--text-1);
  font-size:18px;
}
.btn-icon:hover:not(:disabled),.btn-newday:hover:not(:disabled){background:rgba(139,125,255,0.3);border-color:var(--accent);transform:scale(1.06)}
.btn-icon:active:not(:disabled),.btn-newday:active:not(:disabled){transform:scale(0.9)}
.btn-icon:disabled,.btn-newday:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.btn-cancel-gen{border-color:rgba(248,113,113,0.5)!important;background:rgba(248,113,113,0.12)!important;color:#e05a5a!important}
.btn-cancel-gen:hover:not(:disabled){background:rgba(248,113,113,0.22)!important;border-color:#e05a5a!important}

/* ===== 侧边栏 v3 — 现代化白玻璃 ===== */
.sidebar-left,.sidebar-right{position:fixed;top:0;width:272px;height:100dvh;z-index:120;background:rgba(250,251,254,0.96);overflow-y:auto;transition:left .32s cubic-bezier(.4,0,.2,1),right .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:0 0 18px;will-change:left,right}
.sidebar-left{left:-300px;border-right:1px solid var(--glass-border);box-shadow:12px 0 48px rgba(80,110,180,0.18)}
.sidebar-left.show{left:0}
.sidebar-right{right:-300px;border-left:1px solid var(--glass-border);box-shadow:-12px 0 48px rgba(80,110,180,0.18)}
.sidebar-right.show{right:0}
/* 手机侧边栏底部：双通道后台状态条（api1 主通道 / api2 第二通道） */
.phone-api-status{margin-top:auto;padding:12px 16px 4px;border-top:1px solid var(--glass-border-soft)}
.phone-api-status .pas-title{font-size:10px;color:var(--text-3);letter-spacing:1px;margin-bottom:8px}
.phone-api-status .pas-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);padding:4px 0}
.phone-api-status .pas-name{flex-shrink:0;font-weight:600;color:var(--text-2);min-width:34px}
.phone-api-status .pas-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--text-3);transition:background .3s}
.phone-api-status .pas-text{color:var(--text-3)}
.phone-api-status .pas-row.st-connecting .pas-dot,.phone-api-status .pas-row.st-updating .pas-dot{background:var(--accent);animation:gsPulse 1s ease-in-out infinite}
.phone-api-status .pas-row.st-connecting .pas-text,.phone-api-status .pas-row.st-updating .pas-text{color:var(--accent)}
.phone-api-status .pas-row.st-done .pas-dot{background:#42b883;animation:none}
.phone-api-status .pas-row.st-done .pas-text{color:#42b883}
.phone-api-status .pas-row.st-fail .pas-dot{background:#f87171;animation:none}
.phone-api-status .pas-row.st-fail .pas-text{color:#f87171}
.phone-api-status .pas-row.st-idle .pas-dot{background:var(--text-3);animation:none}
.overlay{position:fixed;inset:0;background:rgba(90,110,160,0.32);z-index:95;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.overlay.show{opacity:1;visibility:visible}
.panel-left,.phone-area{/* 旧样式已废弃 */}

/* 侧栏头部：渐变横幅 */
.sb-header{
  padding:22px 18px 18px;margin-bottom:8px;
  background:var(--blue-pink-gradient);
  color:#fff;position:relative;overflow:hidden;
}
.sb-header::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.18)}
.sb-header .sb-title{font-size:16px;font-weight:700;letter-spacing:0.5px;position:relative}
.sb-header .sb-sub{font-size:11px;opacity:0.9;margin-top:3px;position:relative}

/* 分组标签 */
.sb-group-label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:1px;padding:12px 20px 6px}

/* 菜单项列表 */
.grid-3col{display:flex;flex-direction:column;gap:3px;padding:0 12px}
.grid-3col button,.desktop-grid .app-icon{
  display:flex;flex-direction:row;align-items:center;gap:13px;
  padding:11px 14px;border-radius:13px;position:relative;
  background:transparent;border:1px solid transparent;
  color:var(--text-2);font-size:14px;font-weight:500;cursor:pointer;transition:all .18s;
  text-align:left;
}
/* 图标胶囊 */
.grid-3col button>span:first-child,.desktop-grid .app-icon>span:first-child{
  width:32px;height:32px;flex-shrink:0;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:rgba(91,141,239,0.10);transition:all .18s;
}
.grid-3col button:hover,.desktop-grid .app-icon:hover{
  background:rgba(91,141,239,0.10);color:var(--text-1);
}
.grid-3col button:hover>span:first-child,.desktop-grid .app-icon:hover>span:first-child{
  background:var(--accent-gradient);transform:scale(1.06);
}
.grid-3col button:active,.desktop-grid .app-icon:active{transform:scale(0.98)}
/* 活跃指示条 */
.grid-3col button:hover::before,.desktop-grid .app-icon:hover::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:2px;background:var(--accent);
}

.panel-left-title{display:none}
.panel-left-footer{margin-top:auto;padding:14px 12px 0;margin:auto 12px 0;border-top:1px solid var(--glass-border-soft);display:flex;flex-direction:column;gap:5px}
.panel-left-footer button{
  width:100%;padding:11px 14px;border-radius:13px;
  background:rgba(255,255,255,0.5);border:1px solid var(--glass-border-soft);
  color:var(--text-2);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:flex-start;gap:11px;cursor:pointer;transition:all .18s;
}
.panel-left-footer button>span:first-child{width:28px;height:28px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(91,141,239,0.10);transition:all .18s}
.panel-left-footer button:hover{background:rgba(91,141,239,0.12);color:var(--text-1);border-color:rgba(91,141,239,0.25)}
.panel-left-footer button.danger{color:#e5789a}
.panel-left-footer button.danger>span:first-child{background:rgba(244,166,204,0.22)}
.desktop-grid{display:flex;flex-direction:column;gap:3px;padding:0 12px;flex:1;justify-content:flex-start}

/* ===== 全屏功能页 ===== */
.fullpage{position:fixed;inset:0;z-index:300;background:rgba(249,250,253,0.97);display:flex;flex-direction:column;transform:translateX(100%);opacity:0;visibility:hidden;transition:transform .38s cubic-bezier(.34,1.12,.64,1),opacity .28s ease,visibility .38s}
.fullpage.from-left{transform:translateX(-100%)}
.fullpage.open{transform:translateX(0);opacity:1;visibility:visible}
.fullpage.open{transform:translateX(0);opacity:1;visibility:visible}
.fullpage-topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;height:56px;flex-shrink:0;background:var(--glass-2);border-bottom:1px solid var(--glass-border-soft);box-shadow:0 2px 20px rgba(0,0,0,0.25)}
.fullpage-back{width:38px;height:38px;border-radius:12px;font-size:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.12);border:1px solid var(--glass-border-soft);color:var(--text-1);flex-shrink:0;cursor:pointer;transition:all .2s}
.fullpage-back:hover{background:rgba(139,125,255,0.3);border-color:var(--accent)}
.fullpage-back:active{transform:scale(0.92)}
.fullpage-title{font-size:16px;font-weight:600;color:var(--text-1);letter-spacing:0.5px}
.fullpage-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:24px 20px}
/* 查看类：内容居中限宽 */
.fullpage-body>.fp-inner{max-width:720px;margin:0 auto}
/* 制作类：宽布局分栏 */
.fullpage-body.wide{padding:0}
.fullpage-body.wide>.fp-inner{max-width:none;margin:0;height:100%}

/* ===== 预设分栏页 ===== */
.preset-layout{display:flex;height:100%;min-height:0}
.preset-col-list{width:320px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:8px}
.preset-col-edit{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.preset-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.preset-list-item{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);cursor:pointer;transition:all .2s;color:var(--text-1)}
.preset-list-item:hover{background:rgba(123,108,255,0.12);border-color:rgba(123,108,255,0.3)}
.preset-list-item.active{background:rgba(123,108,255,0.18);border-color:var(--accent)}
.preset-list-item .pli-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-list-item .pli-len{font-size:11px;color:var(--text-3);flex-shrink:0}
.preset-list-sec{font-size:11px;color:var(--text-3);margin:10px 4px 2px}
.preset-edit-empty{color:var(--text-3);text-align:center;padding:60px 20px;font-size:13px}
.preset-edit-head{font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:10px}
.preset-edit-area{width:100%;min-height:360px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-1);font-size:13px;font-family:monospace;line-height:1.6;resize:vertical;outline:none;white-space:pre-wrap}
.preset-edit-area:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(123,108,255,0.15)}
.preset-edit-actions{display:flex;gap:8px;margin-top:12px}
/* 手机端预设：单栏手风琴 */
.preset-acc{display:none}
@media (max-width:1023px){
  .preset-layout{display:none}
  .preset-acc{display:block;padding:16px 14px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .preset-row{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:rgba(255,255,255,0.03)}
  .preset-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
  .preset-name{flex:1;font-size:13px;color:var(--text-1)}
  .preset-len{font-size:11px;color:var(--text-3)}
  .preset-bd{padding:0 14px 14px}
}
</style>
<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script>
</head>
<body>
<div id="bg-layer"></div>
<div id="bg-scrim"></div>
<!-- ==================== 初始界面（主页面之前） ==================== -->
<div id="startup" class="startup">
  <div class="startup-inner">
    <div class="startup-logo"><span data-icon="sparkles" data-icon-size="56"></span></div>
    <div class="startup-title">可爱徒弟系统</div>

.item-detail-mask{position:fixed;inset:0;z-index:600;background:rgba(30,40,70,0.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.item-detail-mask.open{opacity:1;visibility:visible}
.item-detail-sheet{width:100%;max-width:480px;background:rgba(249,250,253,0.97);border-radius:24px 24px 0 0;padding:0 0 32px;box-shadow:0 -8px 40px rgba(91,141,239,0.18);transform:translateY(100%);transition:transform .32s cubic-bezier(.34,1.1,.64,1)}
.item-detail-mask.open .item-detail-sheet{transform:translateY(0)}
.item-detail-handle{width:40px;height:4px;border-radius:2px;background:rgba(120,150,210,0.3);margin:12px auto0}
.item-detail-head{display:flex;align-items:center;gap:14px;padding:16px 20px 10px}
.item-detail-ico{font-size:36px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:linear-gradient(135deg,rgba(91,141,239,0.12),rgba(143,184,248,0.2));flex-shrink:0}
.item-detail-meta{flex:1;min-width:0}
.item-detail-name{font-size:17px;font-weight:700;color:var(--text-1)}
.item-detail-grade{font-size:11px;margin-top:4px}
.item-detail-desc{font-size:13px;color:var(--text-2);line-height:1.6;padding:0 20px 12px;border-bottom:1px solid rgba(120,150,210,0.14)}
.item-detail-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 20px}
.ids-cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:14px;background:rgba(91,141,239,0.07);border:1px solid rgba(91,141,239,0.1)}
.ids-val{font-size:17px;font-weight:700;color:var(--text-1)}
.ids-bar-wrap{width:36px;height:3px;border-radius:3px;background:rgba(91,141,239,0.15)}
.ids-bar{height:100%;border-radius:3px;background:var(--accent-gradient)}
.ids-label{font-size:10px;color:var(--text-3);margin-top:1px}
.item-detail-actions{display:flex;gap:10px;padding:4px 20px 0}
.item-detail-actions .item-act-btn{flex:1;padding:10px 6px;font-size:13px;border-radius:12px;text-align:center}
/*紧凑物品行（不展开操作按钮） */
.item-row-compact{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,0.78);border:1px solid rgba(120,150,210,0.18);box-shadow:0 2px 8px rgba(91,141,239,0.05);margin-bottom:8px;cursor:pointer;transition:box-shadow .18s,transform .12s;position:relative;overflow:hidden}
.item-row-compact::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.item-row-compact:hover{box-shadow:0 4px 14px rgba(91,141,239,0.12)}
.item-row-compact:active{transform:scale(.98)}
.item-row-compact .irc-ico{font-size:22px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,rgba(91,141,239,0.09),rgba(143,184,248,0.14));flex-shrink:0}
.item-row-compact .irc-info{flex:1;min-width:0}
.item-row-compact .irc-name{font-size:13px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:5px}
.item-row-compact .irc-sub{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.item-row-compact .irc-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.item-row-compact .irc-count{font-size:12px;font-weight:700;color:var(--accent)}
.item-row-compact .irc-price{font-size:10px;color:var(--text-3)}
/* 物品等级颜色（12档，从低到高） */
.item-grade-1{border-left:3px solid #6b7280}   /* 凡品·下 灰 */
.item-grade-2{border-left:3px solid #9ca3af}   /* 凡品·中 浅灰 */
.item-grade-3{border-left:3px solid #d1d5db}   /* 凡品·上 白灰 */
.item-grade-4{border-left:3px solid #22c55e}   /* 灵品·下 绿 */
.item-grade-5{border-left:3px solid #4ade80}   /* 灵品·中 亮绿 */
.item-grade-6{border-left:3px solid #86efac}   /* 灵品·上 淡绿 */
.item-grade-7{border-left:3px solid #3b82f6}   /* 宝品·下 蓝 */
.item-grade-8{border-left:3px solid #60a5fa}   /* 宝品·中 亮蓝 */
.item-grade-9{border-left:3px solid #93c5fd}   /* 宝品·上 淡蓝 */
.item-grade-10{border-left:3px solid #a855f7}  /* 仙品·下 紫 */
.item-grade-11{border-left:3px solid #c084fc}  /* 仙品·中 亮紫 */
.item-grade-12{border-left:3px solid #f59e0b;box-shadow:0 0 6px rgba(245,158,11,0.35)}  /* 神品 金 */
.item-grade-badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:0.5px;opacity:0.85}
.grade-badge-1,.grade-badge-2,.grade-badge-3{background:rgba(107,114,128,0.25);color:#9ca3af}
.grade-badge-4,.grade-badge-5,.grade-badge-6{background:rgba(34,197,94,0.2);color:#4ade80}
.grade-badge-7,.grade-badge-8,.grade-badge-9{background:rgba(59,130,246,0.2);color:#60a5fa}
.grade-badge-10,.grade-badge-11{background:rgba(168,85,247,0.2);color:#c084fc}
.grade-badge-12{background:rgba(245,158,11,0.25);color:#f59e0b}
/* 背包双栏布局 */
.inv-wrap{display:flex;gap:0;height:100%;flex-direction:column}
.inv-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.inv-tab-btn{flex:1;padding:10px;font-size:13px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);cursor:pointer}
.inv-tab-btn.active{color:var(--accent-light);border-bottom-color:var(--accent)}
.inv-pane{display:none;flex:1;overflow-y:auto;padding:12px}
.inv-pane.active{display:block}
.inv-section-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-3);text-transform:uppercase;padding:6px 0 8px;margin-top:4px}
/* 物品操作按钮行 */
.item-actions{display:flex;gap:6px;flex-shrink:0}
.item-act-btn{padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text-2);font-size:11px;cursor:pointer;transition:all .15s}
.item-act-btn:hover{background:rgba(91,141,239,0.15);border-color:rgba(91,141,239,0.4);color:var(--accent-light)}
.item-act-btn.danger:hover{background:rgba(248,113,113,0.15);border-color:rgba(248,113,113,0.4);color:#f87171}
/* 多选工具栏 */
.multiselect-bar{display:none;position:sticky;bottom:0;padding:10px 12px;background:var(--surface);border-top:1px solid var(--border);gap:8px;align-items:center;z-index:10}
.multiselect-bar.show{display:flex}
.multiselect-count{flex:1;font-size:13px;color:var(--text-2)}
/* 商城单列卡片 */
.shop-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);text-align:left}
.shop-ico{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:14px;color:var(--text-1);font-weight:500}
.shop-desc{font-size:11px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-buy{padding:7px 14px;border-radius:10px;border:none;background:var(--accent-gradient);color:#fff;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}
.item-icon{font-size:24px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(123,108,255,0.1);border-radius:10px;flex-shrink:0}
.item-info{flex:1}
.item-name{font-size:14px;color:var(--text-1)}
.item-sub{font-size:11px;color:var(--text-3)}
.item-count{font-size:13px;color:var(--accent-light);font-weight:600}
/* 对话记录 */
.chat-log{display:flex;flex-direction:column;gap:10px}
.chat-line{max-width:80%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5}
.chat-line.her{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-line.you{align-self:flex-end;background:var(--accent-gradient);color:#fff;border-bottom-right-radius:4px}
.chat-toast{text-align:center;font-size:12px;color:var(--accent-light);padding:8px;opacity:0;transition:opacity .3s}
.chat-toast.show{opacity:1}

/* ===== v0.5 手机 App 面板 ===== */
/* 钱包 */
.wallet-hero{text-align:center;padding:18px;border-radius:16px;background:var(--accent-gradient);margin-bottom:16px;box-shadow:0 8px 24px rgba(108,92,231,0.3)}
.wallet-label{font-size:12px;color:rgba(255,255,255,0.75)}
.wallet-balance{font-size:32px;font-weight:700;color:#fff;margin-top:4px}
.rec-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
.rec-row:last-child{border-bottom:none}
.rec-icon{font-size:18px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border-radius:9px;flex-shrink:0}
.rec-info{flex:1}
.rec-name{font-size:13px;color:var(--text-1)}
.rec-time{font-size:11px;color:var(--text-3)}
.rec-amt{font-size:14px;font-weight:600}
.rec-amt.plus{color:#4ade80}
.rec-amt.minus{color:#f87171}
/* 商城 */
.shop-grid{display:flex;flex-direction:column;gap:10px}
.shop-card{display:flex;align-items:center;gap:13px;padding:13px 13px 13px 17px;border-radius:16px;background:rgba(255,255,255,0.78);border:1px solid rgba(120,150,210,0.18);box-shadow:0 2px 10px rgba(91,141,239,0.07);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.shop-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent-gradient);border-radius:4px 0 0 4px}
.shop-card.tier-high::before{background:linear-gradient(180deg,#ffd270,#ffab00)}
.shop-card.tier-mid::before{background:var(--accent-gradient)}
.shop-card.tier-low::before{background:linear-gradient(180deg,#5cd9a0,#2ec480)}
.shop-card:active{transform:scale(.985)}
.shop-ico{font-size:27px;width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(91,141,239,0.1),rgba(143,184,248,0.16));border-radius:14px}
.shop-info{flex:1;min-width:0}
.shop-name-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.shop-name{font-size:14px;color:var(--text-1);font-weight:600}
.shop-desc{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}
.shop-stock{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10px;color:var(--text-3)}
.shop-stock-bar{width:40px;height:3px;border-radius:3px;background:rgba(91,141,239,0.14);overflow:hidden;flex-shrink:0}
.shop-stock-fill{height:100%;border-radius:3px;background:var(--accent-gradient);transition:width .4s}
.shop-card.tier-high .shop-stock-fill{background:linear-gradient(90deg,#ffd270,#ffab00)}
.shop-card.tier-low .shop-stock-fill{background:linear-gradient(90deg,#5cd9a0,#2ec480)}
.shop-buy{padding:9px 13px;border-radius:12px;border:none;white-space:nowrap;background:var(--accent-gradient);color:#fff;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;box-shadow:0 3px 10px rgba(91,141,239,0.26);transition:transform .15s,box-shadow .15s}
.shop-buy:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(91,141,239,0.34)}
.shop-buy:active{transform:scale(.94);box-shadow:none}
.shop-buy:disabled{cursor:not-allowed;transform:none;box-shadow:none;background:rgba(130,135,155,.18);color:var(--text-3);font-weight:500}
.shop-card.sold-out{opacity:.68}
.shop-card.sold-out .shop-name{text-decoration:line-through;color:var(--text-3)}
.shop-card.sold-out .shop-ico{filter:grayscale(.5)saturate(.5)}
.shop-tier{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;letter-spacing:.2px}
.shop-tier.tier-high{background:rgba(255,185,0,.14);color:#b07800;border:1px solid rgba(255,170,0,.22)}
.shop-tier.tier-mid{background:rgba(91,141,239,.13);color:#3a6bd4;border:1px solid rgba(91,141,239,.2)}
.shop-tier.tier-low{background:rgba(46,196,128,.13);color:#1a8a5a;border:1px solid rgba(46,196,128,.2)}
/* 新闻 */
.news-row{position:relative;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,0.78);border:1px solid rgba(120,150,210,0.18);box-shadow:0 2px 8px rgba(91,141,239,0.06);margin-bottom:9px;transition:box-shadow .18s}
.news-row:last-child{margin-bottom:0}
.news-row:hover{box-shadow:0 4px 14px rgba(91,141,239,0.12)}
.news-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;background:rgba(91,141,239,.13);color:#3a6bd4;border:1px solid rgba(91,141,239,.18);margin-bottom:6px;letter-spacing:.2px}
.news-title{font-size:13px;color:var(--text-1);line-height:1.6;padding-right:28px}
.news-time{font-size:11px;color:var(--text-3);margin-top:5px}
.delete-icon-btn{width:30px;height:30px;border:none;border-radius:9px;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;opacity:0;transition:opacity .2s,background .2s,color .2s,transform .15s}
.news-row:hover .delete-icon-btn,.msg-row:hover .delete-icon-btn{opacity:1}
.delete-icon-btn:hover{background:rgba(248,113,113,.14);color:#f87171;opacity:1}
.delete-icon-btn:active{transform:scale(.88)}
.news-row>.delete-icon-btn{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.news-row:hover>.delete-icon-btn{transform:translateY(-50%)}
.news-row>.delete-icon-btn:active{transform:translateY(-50%) scale(.88)}
.msg-row>.delete-icon-btn{margin-left:2px}
.sms-header-actions{display:flex;align-items:center;gap:6px}
.sms-header-actions .delete-icon-btn{width:32px;height:32px;opacity:1;background:rgba(248,113,113,.08);color:#f87171}
.sms-header-actions .delete-icon-btn:hover{background:rgba(248,113,113,.2)}
.sms-bubble-wrap{position:relative;max-width:78%;display:flex;align-items:center;gap:4px}
.sms-bubble-wrap .sms-bubble{max-width:100%}
.sms-msg-delete{width:22px;height:22px;border:none;border-radius:50%;background:transparent;color:var(--text-3);cursor:pointer;opacity:0;flex-shrink:0;transition:opacity .18s,background .18s,color .18s}
.sms-bubble-wrap:hover .sms-msg-delete{opacity:.7}
.sms-msg-delete:hover{background:rgba(248,113,113,.14);color:#f87171;opacity:1}
.sms-msg-delete:active{background:rgba(248,113,113,.24)}
/* 短信 */
.msg-row{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,0.78);border:1px solid rgba(120,150,210,0.18);box-shadow:0 2px 8px rgba(91,141,239,0.06);margin-bottom:9px;transition:box-shadow .18s,background .18s}
.msg-row:last-child{margin-bottom:0}
.msg-row:hover{box-shadow:0 4px 14px rgba(91,141,239,0.12)}
.msg-avatar{width:42px;height:42px;border-radius:50%;background:rgba(123,108,255,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.msg-info{flex:1;min-width:0}
.msg-from{font-size:13px;color:var(--text-1);font-weight:500;display:flex;align-items:center;gap:6px}
.msg-dot{width:7px;height:7px;border-radius:50%;background:#f87171;flex-shrink:0}
.msg-preview{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.msg-time{font-size:11px;color:var(--text-3);flex-shrink:0}
/* 短信聊天气泡 */
.sms-chat-wrap{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.sms-chat-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.sms-contact-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.sms-chat-header .back-btn{background:none;border:none;color:var(--accent-light);font-size:22px;cursor:pointer;padding:0 6px;line-height:1}
.sms-chat-header .chat-name{font-size:15px;font-weight:600;color:var(--text-1);flex:1}
.sms-chat-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.sms-bubble-row{display:flex;width:100%}
.sms-bubble-row.them{justify-content:flex-start}
.sms-bubble-row.me{justify-content:flex-end}
.sms-bubble{max-width:72%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.55;word-break:break-word}
.sms-bubble-row.them .sms-bubble{background:rgba(255,255,255,0.12);color:var(--text-1);border-bottom-left-radius:4px}
.sms-bubble-row.me .sms-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.sms-bubble-time{font-size:10px;color:var(--text-3);margin-top:3px;text-align:right}
.sms-bubble-row.them .sms-bubble-time{text-align:left}
.sms-typing{display:flex;gap:4px;align-items:center;padding:10px 13px;background:rgba(255,255,255,0.08);border-radius:18px;border-bottom-left-radius:4px;width:56px}
.sms-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:smsTyping 1.2s infinite}
.sms-typing span:nth-child(2){animation-delay:.2s}
.sms-typing span:nth-child(3){animation-delay:.4s}
@keyframes smsTyping{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.sms-chat-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface);flex-shrink:0}
.sms-chat-footer textarea{flex:1;background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:20px;padding:9px 14px;color:var(--text-1);font-size:14px;resize:none;outline:none;max-height:100px;line-height:1.4}
.sms-chat-footer .send-sms-btn{background:var(--accent);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;align-self:flex-end}
/* 设置占位 */
.set-hint{text-align:center;padding:30px 12px;color:var(--text-3)}

/* ===== 玻璃拟态：统一提亮面板内卡片组件 ===== */
.tap-item,.item-row,
.rec-row,.kv-row,.chat-line.her{
  background:rgba(255,255,255,0.6)!important;
  border-color:var(--glass-border-soft)!important;
  color:var(--text-1)!important;
}
.bar{background:rgba(91,141,239,0.14)!important}
.msg-avatar,.item-icon,.rec-icon{background:rgba(91,141,239,0.14)!important}
.tap-item:hover{background:rgba(91,141,239,0.14)!important;border-color:rgba(91,141,239,0.32)!important}
.set-input,.preset-edit-area,.set-select{background:rgba(255,255,255,0.7)!important;border-color:var(--glass-border-soft)!important;color:var(--text-1)}
/* 残留紫色悬停统一改蓝 */
.mobile-topbar button:hover,.btn-icon:hover:not(:disabled),.btn-newday:hover:not(:disabled),.fullpage-back:hover{background:rgba(91,141,239,0.18)!important}
.l2d-emo-btn:hover{background:rgba(91,141,239,0.14)!important;border-color:rgba(91,141,239,0.32)!important}
.l2d-emo-btn.active{background:rgba(91,141,239,0.2)!important;border-color:var(--accent)!important;box-shadow:0 0 12px rgba(91,141,239,0.25)!important}
.input-wrapper:focus-within{box-shadow:0 0 0 3px rgba(91,141,239,0.18)!important}
/* 亮色主题：剩余深色残留统一覆盖 */
.portrait-img{background:linear-gradient(160deg,#dbe6fa,#f6dfec)!important;border:1px solid var(--glass-border-soft)!important;box-shadow:0 8px 30px rgba(91,141,239,0.15)!important}
.preset-list-item,.preset-row,.preset-edit-area,.set-btn.ghost{background:rgba(255,255,255,0.6)!important;border-color:var(--glass-border-soft)!important;color:var(--text-1)!important}
.preset-list-item:hover{background:rgba(91,141,239,0.12)!important;border-color:rgba(91,141,239,0.3)!important}

}

}
.l2d-emo-btn{

}
.l2d-emo-btn:hover{background:rgba(139,125,255,0.22);border-color:rgba(183,172,255,0.4);transform:translateY(-2px)}

.l2d-emo-btn.readonly{cursor:default;opacity:0.4}

/* ===== v0.6 设置表单 ===== */
.set-group{margin-bottom:18px}

.set-field{margin-bottom:12px}

.set-input,.set-select{width:100%;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-1);font-size:13px;font-family:inherit;outline:none;transition:all .2s}

.set-range{flex:1}
.set-range-val{font-size:12px;color:var(--accent-light);min-width:34px;text-align:right}
.set-switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.set-switch-label{font-size:13px;color:var(--text-1)}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}

.switch-track{position:absolute;inset:0;background:rgba(255,255,255,0.12);border-radius:12px;transition:all .25s;cursor:pointer}

.set-test-result{font-size:12px;padding:8px;border-radius:8px;margin-top:8px;text-align:center;display:none}
.set-test-result.ok{display:block;background:rgba(74,222,128,0.12);color:#4ade80}
.set-test-result.err{display:block;background:rgba(248,113,113,0.12);color:#f87171}
.set-test-result.loading{display:block;background:rgba(123,108,255,0.12);color:var(--accent-light)}

/* 表情键 → SVG 图标名映射（Live2D 关闭时的立绘占位 / 表情按钮） */
var EMO_ICON={happy:'smile',shy:'smile',sad:'frown',angry:'angry',cry:'cry',calm:'meh'};
function emoSvg(key,size){return svgIcon(EMO_ICON[key]||'meh',size);}
function svgIcon(name,size){
  var p=ICON_PATHS[name];if(!p)return '';
  var s=size||18;
  return '<svg class="ico" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}
function hydrateIcons(root){
  (root||document).querySelectorAll('[data-icon]').forEach(function(el){
    if(el.dataset.iconDone)return;
    var svg=svgIcon(el.getAttribute('data-icon'),el.getAttribute('data-icon-size')?parseInt(el.getAttribute('data-icon-size')):undefined);
    if(svg){el.innerHTML=svg;el.dataset.iconDone='1';}
  });
}

        var lim=s.limit||shopLimitByTier(tier),stock=Math.max(0,s.stock||0),pct=lim>0?Math.round(stock/lim*100):0;
        return '<div class="shop-card tier-'+tier+(sold?' sold-out':'')+'">'+
          '<div class="shop-ico">'+s.icon+'</div>'+

      }).join('')+'</div><div class="chat-toast" id="shop-toast"></div>';

      break;
    case 'modal-messages':
    if(!APPS.messages.length){h=emptyHint('chat','暂无短信。剧情中的联系人会给你发来消息。');break;}
    h=APPS.messages.map(function(m,i){
      return '<div class="msg-row" style="cursor:pointer" onclick="openSmsThread('+i+')">'+
        '<div class="msg-avatar">'+svgIcon(m.unread?'inbox':'mail',18)+'</div>'+
        '<div class="msg-info">'+
          '<div class="msg-from">'+esc(m.from)+(m.unread?'<span class="msg-dot"></span>':'')+'</div>'+
          '<div class="msg-preview">'+esc(m.preview)+'</div>'+
        '</div>'+
        '<div class="msg-time">'+esc(m.time)+'</div>'+
        '<button class="delete-icon-btn" onclick="event.stopPropagation();deleteContact('+i+')" title="删除并拉黑联系人">'+svgIcon('trash',15)+'</button>'+
      '</div>';
    }).join('');
    break;
    case 'modal-settings':
      h=renderSettings();
      break;
    case 'modal-presets':
      h=renderPresetPage();
      break;
    case 'modal-history':
      h=renderHistoryPage();
      break;
    default:return '';
  }
  return h;
}
/* 触摸/送礼/购买：均转化为真实的游戏行动发给 AI（经 window.sendGameAction 派发），由 AI 回合结果驱动状态。

function doTouch(name){
  var t=document.getElementById('touch-toast');
  if(window.sendGameAction){
    if(t){t.textContent='💫 你对她'+name+'……';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1200);}
    closePage();
    window.sendGameAction('（宿主对徒弟做出「'+name+'」的亲密互动，请描写她的即时反应，并按协议更新好感/心情/表情等状态。）','互动中');
  }else if(t){t.textContent='⚠️ 请先在设置中配置 API';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800);}
}
function doGift(name){
  var t=document.getElementById('gift-toast');
  if(window.sendGameAction){
    if(t){t.textContent='🎁 你送出「'+name+'」……';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1200);}
    closePage();
    window.sendGameAction('（宿主将「'+name+'」赠予徒弟，请描写赠礼场景与她感动/惊喜的反应。务必慷慨地奖励：好感+15~25、心情提升至最佳、随身物新增该礼物、至少一项三维数值大幅提升，体现爽文感。）','赠礼中');
  }else if(t){t.textContent='⚠️ 请先在设置中配置 API';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800);}
}

function masterItemGift(i){

function masterItemDestroy(i){

/* ===== 长按多选 ===== */
var LP_TIMER=null,LP_SELECTED=[];
function startLongPress(el,bag,idx){
  if(bag!=='master')return;
  LP_TIMER=setTimeout(function(){
    LP_TIMER=null;
    el.classList.add('selected');
    var wasActive=LP_SELECTED.length>0;
    if(LP_SELECTED.indexOf(idx)<0)LP_SELECTED.push(idx);
    if(!wasActive){
      var pane=document.getElementById('inv-pane-1');
      if(pane)pane.classList.add('multiselect-active');
      var bar=document.getElementById('master-ms-bar');
      if(bar)bar.classList.add('show');
    }
    updateMultiselectCount();
  },500);
}
function cancelLongPress(){if(LP_TIMER){clearTimeout(LP_TIMER);LP_TIMER=null;}}
function updateMultiselectCount(){
  var c=document.getElementById('master-ms-count');
  if(c)c.textContent='已选 '+LP_SELECTED.length+' 件';
}
function cancelMultiselect(){
  LP_SELECTED=[];
  var pane=document.getElementById('inv-pane-1');
  if(pane){pane.classList.remove('multiselect-active');pane.querySelectorAll('.item-row.selected').forEach(function(r){r.classList.remove('selected');});}
  var bar=document.getElementById('master-ms-bar');if(bar)bar.classList.remove('show');
}
function masterBatchGift(){
  if(!LP_SELECTED.length)return;
  if(!window.sendGameAction){dzAlert('请先配置 API');return;}
  var names=LP_SELECTED.map(function(i){return STATE.masterBag[i]?STATE.masterBag[i].name:'';}).filter(Boolean).join('、');
  LP_SELECTED.slice().sort(function(a,b){return b-a;}).forEach(function(i){STATE.masterBag.splice(i,1);});
  cancelMultiselect();saveState();
  closePage();
  window.sendGameAction('（师父将《'+names+'》批量赠予徒弟，请描写盛大赠礼场景与徒弟的感激/惊喜反应。务必给予丰厚奖励：好感+30~50、心情最佳、所有物品加入随身物、多项三维数值大幅提升，每件物品都要有专属的惊喜反馈，体现爽文感。）','批量赠予中');
}
function masterBatchDestroy(){
  if(!LP_SELECTED.length)return;
  var names=LP_SELECTED.map(function(i){return STATE.masterBag[i]?STATE.masterBag[i].name:'';}).filter(Boolean).join('、');
  dzConfirm('确定销毁《'+names+'》？不可恢复。',{tone:'danger',okText:'确定销毁'}).then(function(ok){
    if(!ok)return;
    LP_SELECTED.slice().sort(function(a,b){return b-a;}).forEach(function(i){STATE.masterBag.splice(i,1);});
    cancelMultiselect();saveState();
    var fp=document.getElementById('fullpage');
    if(fp&&fp.classList.contains('open')){
      var b=fp.querySelector('.fullpage-body');if(b){b.innerHTML='<div class="fp-inner">'+renderPanel(fp.dataset.page)+'</div>';hydrateIcons(b);}
    }
  });
}
function doBuy(index){
  var t=document.getElementById('shop-toast');if(!t)return;
  var item=STATE.shop[index];if(!item)return;
  if((item.stock||0)<=0){t.textContent='该商品已售罄，将在下轮刷新时替换';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800);return;}
    if(STATE.host.balance<item.price){t.textContent='💸 余额不足，无法购买《'+item.name+'》';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800);return;}
  // 防双击：临时标记正在购买
  if(item._buying)return; item._buying=true; setTimeout(function(){delete item._buying;},1500);
  STATE.host.balance-=item.price;
  item.stock=Math.max(0,(item.stock||0)-1);
  STATE.walletRec.unshift({icon:'📤',name:'购买'+item.name,amount:'-'+item.price,time:'第'+STATE.meta.day+'日'});
  addMasterItem(item.name,item.desc||'',item.price,item.icon||'🛍️',item.grade||itemGradeFromPrice(item.price));
  saveState();
  t.textContent='✅ 已购入「'+item.name+'」→ 师父背包'+(item.stock<=0?'（已售罄）':'，剩余 '+item.stock);t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000);
  var fp=document.getElementById('fullpage');
  if(fp&&fp.dataset.page==='modal-shop'){var el=fp.querySelector('.fullpage-body');if(el){el.innerHTML='<div class="fp-inner">'+renderPanel('modal-shop')+'</div>';hydrateIcons(el);}}
}

function initSettingsAutosave(root){
  root=root||document.getElementById('fullpage-body');
  if(!root||root.dataset.autosaveBound==='1')return;
  root.dataset.autosaveBound='1';
  function showAutosaveState(text,saving){

    status.className='set-test-result '+(saving?'loading':'ok');
    status.innerHTML=svgIcon(saving?'clock':'check',14)+' '+text;
  }
  function commit(){
    clearTimeout(SETTINGS_AUTOSAVE_TIMER);
    if(!document.getElementById('cfg-provider'))return;
    saveSettings(true);showAutosaveState('已自动保存',false);
  }
  root.addEventListener('input',function(e){
    if(!e.target||!/^cfg-/.test(e.target.id||''))return;
    showAutosaveState('正在保存…',true);
    clearTimeout(SETTINGS_AUTOSAVE_TIMER);
    SETTINGS_AUTOSAVE_TIMER=setTimeout(commit,e.target.type==='range'||e.target.type==='color'?120:500);
  });
  root.addEventListener('change',function(e){
    if(!e.target||!/^cfg-/.test(e.target.id||''))return;

}

function fetchCh2Models(){
  var r=document.getElementById('ch2-result');if(!r)return;

  r.className='set-test-result loading';r.textContent='⏳ 获取第二通道模型列表…';
  var chain=hasNativeBridge()?modelsViaNative(provider,url,key):modelsDirect(provider,url,key).catch(function(e){
    if(e.message==='Failed to fetch'||/CORS|NetworkError|fetch/i.test(e.message))return modelsViaProxy(provider,url,key);

  });
  chain.then(function(list){
    if(!list.length){r.className='set-test-result err';r.textContent='⚠️ 接口返回空列表';return;}
    list.sort();
    var sel=document.getElementById('cfg-ch2model-list');
    if(sel){
      sel.innerHTML='<option value="">— 选择模型（共'+list.length+'）—</option>'+list.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join('');
      sel.style.display='block';
    }
    r.className='set-test-result ok';r.textContent='✅ 获取到 '+list.length+' 个模型，请在下方选择';
  }).catch(function(e){
    r.className='set-test-result err';r.textContent='❌ '+e.message;
  });
}

/* 组装 system prompt：角色卡核心设定 + DZDB 协议 + 当前状态摘要 */
/* 防截断指令 */
/* ===== 预设系统 ===== */
var ANTI_TRUNCATE_PROMPT='【完整输出要求】必须一次性输出完整的一段叙事，不得中途截断、省略或用"（未完待续）""..."敷衍。若接近长度上限，应自然收束当前场景，确保正文末的 <状态> 块完整闭合。严禁在句子中途停止。';
var ANTI_EMPTY_PROMPT='【反空回】禁止输出空回复、纯动作描写或敷衍内容（如"……"）。每回合必须推动剧情或对话。尊重用户输入，基于上下文输出有意义的内容。';
/* 内置词条数据（不可删除，可编辑/开关） */
var BUILTIN_ENTRIES=[
  {id:'anti_truncate',name:'🛡️ 防截断',enabled:true,content:ANTI_TRUNCATE_PROMPT},
  {id:'anti_empty',name:'📝 反空回',enabled:true,content:ANTI_EMPTY_PROMPT}
];
/* 预设状态（导入的词条+内置词条） */
var PRESET={name:'',entries:[],params:{}};
var presetExpandedId=null;   // 当前展开的词条id：'builtin-0' / 'entry-3'
var PRESET_ORIGINALS=[];

/* 导入 SillyTavern JSON 预设 */
function importPresetData(raw){
  var r=(typeof raw==='string')?JSON.parse(raw):raw;
  var prompts=r.prompts||[];
  var orderArr=r.prompt_order||[];
  var order=orderArr[0]&&orderArr[0].order||[];
  var pmap={};prompts.forEach(function(p){pmap[p.identifier]=p;});
  var entries=[];
  order.forEach(function(o){
    var p=pmap[o.identifier];if(!p||!p.content)return;
    entries.push({identifier:o.identifier,name:p.name||'未命名',enabled:o.enabled!==false,content:p.content,role:p.role||'system',injection_position:p.injection_position||0});
  });
  // 提取采样参数
  var par={};
  ['temperature','top_p','top_k','frequency_penalty','presence_penalty','min_p','repetition_penalty','openai_max_tokens'].forEach(function(k){if(r[k]!==undefined)par[k]=r[k];});
  PRESET.name=r.name||'导入预设';
  PRESET.entries=entries;
  PRESET.params=par;
  CONFIG.presetEnabled=true;
  savePreset();saveConfig();
  // 自动应用采样参数
  if(par.temperature!==undefined)CONFIG.temperature=par.temperature;
  if(par.top_p!==undefined)CONFIG.topP=par.top_p;
  if(par.openai_max_tokens!==undefined)CONFIG.maxTokens=par.openai_max_tokens;
  // 重渲染设置页
  var t=document.getElementById('preset-toast');if(t){t.className='set-test-result ok';t.textContent='✅ 已导入「'+PRESET.name+'」'+entries.length+' 个词条';setTimeout(function(){t.className='set-test-result';},3000);}
}

/* 拼接启用的预设词条 */
function buildPresetPrompt(){
  // 按 injection_position 排序，取 enabled 的导入词条
  var enabled=PRESET.entries.filter(function(e){return e.enabled&&e.content;}).slice().sort(function(a,b){return(a.injection_position||0)-(b.injection_position||0);});
  var parts=enabled.map(function(e){return e.content;});
  // 追加内置词条（按自身 enabled）
  BUILTIN_ENTRIES.forEach(function(b){if(b.enabled)parts.push(b.content);});
  return parts.join('\n\n');
}

/* History 二号数据库：保存完整对话归档与可触发记忆，AI 仅接收末尾 10 轮。 */
var HISTORY_DB={entries:[],archived:[]};
var HISTORY_WINDOW_MESSAGES=20;
function normalizeHistoryDB(raw){
  raw=raw&&typeof raw==='object'?raw:{};
  return {
    entries:Array.isArray(raw.entries)?raw.entries.map(function(e){return {id:e.id||('h'+Date.now()+Math.random()),key:e.key||'',name:e.name||'未命名记忆',category:e.category||'其他',keywords:Array.isArray(e.keywords)?e.keywords:[],content:e.content||'',alwaysOn:!!e.alwaysOn,enabled:e.enabled!==false,source:e.source==='auto'?'auto':'manual',importance:Math.max(1,Math.min(5,parseInt(e.importance,10)||3)),createdDay:e.createdDay||1,updatedDay:e.updatedDay||e.createdDay||1};}):[],
    archived:Array.isArray(raw.archived)?raw.archived:[],
    settings:{autoEnabled:!(raw.settings&&raw.settings.autoEnabled===false),maxAutoEntries:Math.max(20,Math.min(200,parseInt(raw.settings&&raw.settings.maxAutoEntries,10)||80))}
  };
}
function saveHistoryDB(){try{localStorage.setItem('dz_history',JSON.stringify(HISTORY_DB));}catch(e){}}
function loadHistoryDB(){try{var s=localStorage.getItem('dz_history');HISTORY_DB=normalizeHistoryDB(s?JSON.parse(s):null);}catch(e){HISTORY_DB=normalizeHistoryDB(null);}}
/* 每段剧情保存自动记忆与归档快照；回滚时保留用户手工词条，仅撤销该剧情造成的自动变更。 */
function captureHistoryRollbackState(){
  return {
    autoEntries:HISTORY_DB.entries.filter(function(e){return e.source==='auto';}).map(function(e){return JSON.parse(JSON.stringify(e));}),
    archived:JSON.parse(JSON.stringify(HISTORY_DB.archived||[]))
  };
}
function restoreHistoryRollbackState(snapshot,restoreChat){
  if(!snapshot)return false;
  var currentArchived=Array.isArray(HISTORY_DB.archived)?HISTORY_DB.archived:[];
  var archived=Array.isArray(snapshot.archived)?snapshot.archived:[];
  // archiveHistoryMessages 会把窗口头部移出 CHAT_HISTORY；恢复快照时也把这些消息放回短期上下文。
  if(restoreChat&&currentArchived.length>archived.length){
    var moved=currentArchived.slice(archived.length).map(function(m){return {role:m.role,content:m.content||m.summary||''};});
    if(moved.length)CHAT_HISTORY=moved.concat(CHAT_HISTORY);
  }
  var manual=HISTORY_DB.entries.filter(function(e){return e.source!=='auto';});
  var autos=Array.isArray(snapshot.autoEntries)?snapshot.autoEntries.map(function(e){return JSON.parse(JSON.stringify(e));}):[];
  HISTORY_DB.entries=manual.concat(autos);
  HISTORY_DB.archived=JSON.parse(JSON.stringify(archived));
  saveHistoryDB();historyRerender();
  return true;
}
function historyAutoKey(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,'_').slice(0,80);}
function historyAutoUpsert(data){
  if(!HISTORY_DB.settings.autoEnabled||!data||!data.content)return;
  var key=historyAutoKey(data.key||data.name),idx=HISTORY_DB.entries.findIndex(function(e){return (key&&historyAutoKey(e.key||e.name)===key)||(data.name&&e.name===data.name);});
  var old=idx>=0?HISTORY_DB.entries[idx]:null;
  // 手动词条不允许自动系统覆盖，只更新自动生成的同类词条。
  if(old&&old.source!=='auto')return;
  var entry={id:old?old.id:'ha'+Date.now()+Math.floor(Math.random()*1000),key:key,name:data.name||data.key||'自动记忆',category:data.category||'其他',keywords:(data.keywords||[]).map(function(x){return String(x).trim();}).filter(Boolean).slice(0,12),content:String(data.content).trim(),alwaysOn:!!data.alwaysOn,enabled:true,source:'auto',importance:Math.max(1,Math.min(5,parseInt(data.importance,10)||3)),createdDay:old?old.createdDay:((STATE.meta&&STATE.meta.day)||1),updatedDay:(STATE.meta&&STATE.meta.day)||1};
  if(old)HISTORY_DB.entries[idx]=entry;else HISTORY_DB.entries.unshift(entry);
  historyPruneAuto();
}
function historyAutoDelete(key){key=historyAutoKey(key);if(!key)return;HISTORY_DB.entries=HISTORY_DB.entries.filter(function(e){return e.source!=='auto'||historyAutoKey(e.key||e.name)!==key;});}
function historyPruneAuto(){
  var limit=HISTORY_DB.settings.maxAutoEntries||80,autos=HISTORY_DB.entries.filter(function(e){return e.source==='auto';});
  if(autos.length<=limit)return;
  autos.sort(function(a,b){return (b.importance-a.importance)||(b.updatedDay-a.updatedDay);});
  var keep={};autos.slice(0,limit).forEach(function(e){keep[e.id]=1;});
  HISTORY_DB.entries=HISTORY_DB.entries.filter(function(e){return e.source!=='auto'||keep[e.id];});
}
function parseHistoryAutomation(raw){
  if(!HISTORY_DB.settings.autoEnabled||!raw)return;
  var re=/<History>([\s\S]*?)<\/History>/gi,m,changed=false;
  while((m=re.exec(raw))!==null){
    m[1].split(/\r?\n/).forEach(function(line){line=line.trim();if(!line)return;var op=line.match(/^_(upsert|delete)\((.*)\)$/i);if(!op)return;var args=splitArgs(op[2]);if(op[1].toLowerCase()==='delete'){historyAutoDelete(args[0]);changed=true;return;}if(args.length>=5){historyAutoUpsert({key:args[0],category:args[1],name:args[2],keywords:String(args[3]||'').split(/[|｜]/),content:args[4],alwaysOn:/^(true|1|yes|常驻)$/i.test(args[5]||''),importance:args[6]||3});changed=true;}});
  }
  if(changed){saveHistoryDB();historyRerender();}
}

/* 构建最终 system prompt */
function buildSystemPrompt(lastUserMsg){
  var d=STATE.disciple;
  // 依当前好感等级动态生成"此刻允许的跨界形式"硬约束，防止 AI 越权让两个世界相遇
  var lv=(d.aff&&typeof d.aff.level==='number')?d.aff.level:0;
  var crossRule;
  if(lv<=2)      crossRule='当前好感Lv.'+lv+'：仅隔屏互动。徒弟在她自己的世界，user 在现实，两人【不在同一空间】，绝不可让任何一方进入对方的世界或面对面同处。触摸/对话都透过 App 屏幕进行。';
  else if(lv===3)crossRule='当前好感Lv.3：user 可将意识投射入徒弟世界，仅以「虚影」短暂现身，不可实体接触、不可长留；徒弟【仍不能】来到现实。除此虚影外两人不共处。';
  else if(lv===4)crossRule='当前好感Lv.4：user 可实体短暂进入徒弟世界并真实接触，但只是短暂停留、须返回现实；徒弟【仍不能】主动来到现实世界。';
  else if(lv===5)crossRule='当前好感Lv.5：在既有权限外，徒弟方可短暂投射到 user 的现实世界；仍非长驻，跨界须有明确契机。';
  else           crossRule='当前好感Lv.'+lv+'（道侣段位）：跨界渐无阻，可在对方世界停留；但仍需契合剧情，不得无理由随意穿梭。';
  var stateBrief='【当前状态】第'+STATE.meta.day+'日·'+STATE.meta.period+'·'+STATE.meta.place+
    '；徒弟：'+d.name+'（'+d.realm+'）好感Lv.'+d.aff.level+'('+d.aff.value+'/'+d.aff.max+')'+
    ' 修为'+d.stats.cultivation.value+' 心境'+d.stats.mind.value+' 境遇'+d.stats.fortune.value+
    '；宿主余额¥'+STATE.host.balance+'；认知：'+STATE.meta.cognition+'。'+
    '\n【本回合跨界权限·硬约束】'+crossRule;
  var base;
  if(CONFIG.presetEnabled){
    // 预设模式：导入词条（enabled）+ 内置词条（enabled）+ DZDB 协议
    base=buildPresetPrompt()+'\n\n'+DZDB_PROTOCOL;
  }else{
    base=SYSTEM_PROMPT_BASE;
    // 无预设时仍启用内置词条
    var extras='';BUILTIN_ENTRIES.forEach(function(b){if(b.enabled)extras+='\n\n'+b.content;});
    base+=extras;
  }
  var out=base+'\n\n人称要求：以'+CONFIG.pov+'叙事。'+
    (CONFIG.nsfw?'\n\n'+NSFW_PROMPT:'\n保持内容克制，亲密场景点到为止，不作露骨描写。');
  var historyInjection=buildHistoryInjection(lastUserMsg);
  return out+'\n\n'+stateBrief+(historyInjection?'\n\n'+historyInjection:'')+(HISTORY_DB.settings.autoEnabled?'\n\n'+HISTORY_AUTO_PROMPT+(buildAutoMemoryCatalog()?'\n\n'+buildAutoMemoryCatalog():''):'');
}

/* 持久化 */
function savePreset(){try{localStorage.setItem('dz_preset',JSON.stringify({name:PRESET.name,entries:PRESET.entries,params:PRESET.params,buildinEnabled:BUILTIN_ENTRIES.map(function(b){return{id:b.id,enabled:b.enabled,content:b.content};})}));}catch(e){}}
function loadPreset(){
  try{var s=localStorage.getItem('dz_preset');if(!s)return;
    var d=JSON.parse(s);PRESET.name=d.name||'';PRESET.entries=d.entries||[];PRESET.params=d.params||{};
    // 恢复内置词条状态（只覆盖 enabled/content，不增删）
    if(d.buildinEnabled)BUILTIN_ENTRIES.forEach(function(b){
      var m=d.buildinEnabled.find(function(x){return x.id===b.id;});if(m){b.enabled=m.enabled!==false;if(m.content)b.content=m.content;}
    });

  PRESET_ORIGINALS=PRESET.entries.map(function(e){return e.content||'';});
}
/* 统一入口：messages=[{role,content}]，onChunk(delta) 流式回调，返回完整文本 */
/* ===== AI 调用：三层路由（原生桥 > 直连 > 后端代理） =====
   1. 原生桥（NativeBridge）：APK 打包后 Activity 注入，用 Android HttpURLConnection 发请求，
      天然带 Content-Length，彻底绕开 WebView chunked 问题，支持流式，单个 APK 无需外部后端。
   2. 直连（direct）：WebView 自己的 fetch，普通浏览器/HTTPS 中转站通常正常，裸 IP 中转站会 400。
   3. 后端代理（proxy）：经 Node 或 Supabase Edge Function 转发，开发调试用。 */
function callAI(messages,onChunk,onConnected){
  // 优先级 1：检测原生桥（APK 环境下 MainActivity 会注入）
  if(typeof window.NativeBridge!=='undefined'&&window.NativeBridge.httpRequest){
    return callViaNativeBridge(messages,onChunk,onConnected);
  }
  // 优先级 2/3：按 aiMode 走直连或代理
  var mode=CONFIG.aiMode||'auto';
  if(mode==='proxy')return callViaProxy(messages,onChunk,onConnected);
  if(mode==='direct')return callDirect(messages,onChunk,onConnected);
  // auto：先直连，遇到 CORS/网络错误再回退代理
  return callDirect(messages,onChunk,onConnected).catch(function(e){
    if(e.message==='Failed to fetch'||/CORS|NetworkError|fetch/i.test(e.message)){
      return callViaProxy(messages,onChunk,onConnected);
    }
    throw e;   // 其它错误（如 API Key 错）直接抛出，不必回退
  });
}
/* 直连 AI（三协议） */
/* 带超时的 fetch：真正网络挂起时中止，避免无限等待。opts.signal 已被内部占用 */
function fetchWithTimeout(url,opts){
  var ms=(CONFIG.aiTimeoutMs>0?CONFIG.aiTimeoutMs:60000);
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var o=Object.assign({},opts||{});
  var timer=null,timedOut=false;
  if(ctrl){
    o.signal=ctrl.signal;
    CURRENT_AI_CTRL=ctrl;   // 暴露给“停止/取消”按钮
    // 超时仅守护“首字节到达前”的连接阶段；流式下响应头很快返回即清除
    timer=setTimeout(function(){timedOut=true;try{ctrl.abort();}catch(e){}},ms);
  }
  return fetch(url,o).then(function(r){if(timer)clearTimeout(timer);return r;},function(e){
    if(timer)clearTimeout(timer);
    if(e&&(e.name==='AbortError')){
      // 超时中止：服务器接受了连接却在 ms 内未返回响应头（真正的挂起）
      if(timedOut)throw new Error('连接超时：'+Math.round(ms/1000)+'s 内服务器未返回响应头。通常是代理地址不可达、或协议/模型不匹配导致对端挂起，请到「设置」核对 API 地址、协议与模型。');
      var err=new Error('__USER_CANCELLED__');err.userCancelled=true;throw err;   // 用户主动取消
    }
    // 网络层错误（DNS 解析失败/连接被拒/证书错误等）会立即 reject，不经过超时，给出清晰提示
    if(e&&(e.name==='TypeError'||/Failed to fetch|NetworkError|Load failed/i.test(e.message||''))){
      throw new Error('无法连接到服务器：地址填写错误或网络不可达。请到「设置」检查 API 地址是否正确、能否访问。');
    }
    throw e;
  });
}
function callDirect(messages,onChunk,onConnected){
  var p=CONFIG.provider;
  if(p==='claude')return callClaude(messages,onChunk,onConnected);
  if(p==='gemini')return callGemini(messages,onChunk,onConnected);
  return callOpenAI(messages,onChunk,onConnected);
}
/* 经原生 HTTP 桥（APK 内 MainActivity 注入的 NativeBridge）发请求。
   用 Android HttpURLConnection，天然带 Content-Length，支持流式 SSE 回调。
   无需外部后端，APK 单包即可直连任意 AI 服务/中转站。 */
function callViaNativeBridge(messages,onChunk,onConnected,cfgOverride){
  return new Promise(function(resolve,reject){
    // 构建 URL、headers、payload（逻辑与 backend/routes/ai.js 一致）
    // cfgOverride 供第二通道传入独立配置（provider/apiUrl/apiKey/model）
    var C=cfgOverride||CONFIG;
    var provider=C.provider||'openai';
    var model=apiModelId(C.model),key=C.apiKey;
    var temperature=C.temperature||CONFIG.temperature||0.8,topP=C.topP||CONFIG.topP||0.9;
    var maxTokens=normalizeMaxTokens(C.maxTokens!=null?C.maxTokens:(cfgOverride?1500:CONFIG.maxTokens));
    var useStream=!!(C.stream||CONFIG.stream||false);
    var url,headers={},payload;

    if(provider==='claude'){
      var cu=deriveChatUrl(C.apiUrl,'claude');
      url=cu;
      var sys=messages.filter(function(m){return m.role==='system';}).map(function(m){return m.content;}).join('\n');
      var msgs=messages.filter(function(m){return m.role!=='system';});
      headers={'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'};
      payload={model:model,system:sys,messages:msgs,max_tokens:maxTokens,temperature:temperature,top_p:topP,stream:useStream};
    } else if(provider==='gemini'){
      var base=(C.apiUrl||'https://generativelanguage.googleapis.com/v1beta').trim().replace(/\/+$/,'').replace(/\/models(\/.*)?$/,'');
      if(!/\/v1(beta)?$/.test(base))base+='/v1beta';
      url=base+'/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse&key='+encodeURIComponent(key);
      var sys2=messages.filter(function(m){return m.role==='system';}).map(function(m){return m.content;}).join('\n');
      var contents=messages.filter(function(m){return m.role!=='system';}).map(function(m){return{role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]};});
      headers={'Content-Type':'application/json'};
      payload={systemInstruction:{parts:[{text:sys2}]},contents:contents,generationConfig:{temperature:temperature,topP:topP,maxOutputTokens:maxTokens}};
    } else {
      url=deriveChatUrl(C.apiUrl,'openai');
      headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
      var isThinking=/think|reason|o1|o3|o4-mini/i.test(model||'');
      payload={model:model,messages:messages,max_tokens:maxTokens,stream:useStream};
      if(isThinking){payload.temperature=1;}
      else{payload.temperature=temperature;payload.top_p=topP;}
    }

    // 注册全局回调（NativeBridge 通过 evaluateJavascript 调用）
    var reqId='nb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    var full='',connectedFired=false;
    var timer=setTimeout(function(){
      cleanup();reject(new Error('NativeBridge 请求超时（'+(CONFIG.aiTimeoutMs||60000)+'ms）'));
    },CONFIG.aiTimeoutMs||60000);

    function cleanup(){
      clearTimeout(timer);
      var old=window.__nativeHttpCallback;
      if(old&&old._reqId===reqId)window.__nativeHttpCallback=null;
    }

    window.__nativeHttpCallback=function(id,type,data){
      if(id!==reqId)return;
      if(type==='chunk'){
        // Kotlin 已解析 SSE、提取出纯文本 delta，直接累积即可
        var dc=data||'';
        if(dc){full+=dc;if(!connectedFired){connectedFired=true;if(onConnected)onConnected();}if(onChunk)onChunk(dc);}
      } else if(type==='full'){
        // Kotlin 流式结束后回传完整累积文本（纯文本，非 JSON）
        var finalText=data||full;
        if(finalText){
          full=finalText;
          if(onConnected&&!connectedFired){connectedFired=true;onConnected();}
          if(onChunk&&!full)onChunk(full);
        }
        cleanup();
        if(!full)reject(new Error('未收到 AI 输出'));else resolve(full);
      } else if(type==='done'){
        cleanup();if(!full)reject(new Error('未收到 AI 输出'));else resolve(full);
      } else if(type==='error'){
        cleanup();reject(new Error(data||'NativeBridge 请求失败'));
      }
    };
    window.__nativeHttpCallback._reqId=reqId;

    try{
      window.NativeBridge.httpRequest(reqId,'POST',url,JSON.stringify(headers),JSON.stringify(payload),useStream);
    }catch(e){cleanup();reject(new Error('NativeBridge 调用失败: '+e.message));}
  });
}
/* 是否处于 APK 原生桥环境 */
function hasNativeBridge(){return typeof window.NativeBridge!=='undefined'&&!!window.NativeBridge.httpRequest;}
/* 通用原生 HTTP（非流式）：经 NativeBridge 发一次请求，返回完整响应文本。
   method: 'GET'/'POST'；headers/body 为对象/字符串。用于获取模型列表、第二通道等非流式场景。 */
function nativeHttpRaw(method,url,headers,body){
  return new Promise(function(resolve,reject){
    var reqId='nbr_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    var timer=setTimeout(function(){cleanup();reject(new Error('原生请求超时'));},CONFIG.aiTimeoutMs||60000);
    function cleanup(){clearTimeout(timer);var old=window.__nativeHttpCallback;if(old&&old._reqId===reqId)window.__nativeHttpCallback=null;}
    window.__nativeHttpCallback=function(id,type,data){
      if(id!==reqId)return;
      if(type==='full'){cleanup();resolve(data||'');}
      else if(type==='error'){cleanup();reject(new Error(data||'原生请求失败'));}
      else if(type==='done'){cleanup();resolve('');}
    };
    window.__nativeHttpCallback._reqId=reqId;
    try{
      window.NativeBridge.httpRequest(reqId,method||'POST',url,JSON.stringify(headers||{}),body?(typeof body==='string'?body:JSON.stringify(body)):'',false);
    }catch(e){cleanup();reject(new Error('NativeBridge 调用失败: '+e.message));}
  });
}
/* 经本地后端代理 */
function callViaProxy(messages,onChunk,onConnected){
  var full='';
  var backend=(CONFIG.backendUrl||'http://localhost:3001').replace(/\/+$/,'');
  return fetchWithTimeout(backend+'/api/ai/chat',{
    method:'POST',headers:cloudProxyHeaders(),
    body:JSON.stringify({provider:CONFIG.provider,apiUrl:CONFIG.apiUrl,apiKey:CONFIG.apiKey,model:CONFIG.model,messages:messages,temperature:CONFIG.temperature,topP:CONFIG.topP,maxTokens:CONFIG.maxTokens})
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('后端 HTTP '+r.status+': '+t.slice(0,200));});
    if(onConnected)onConnected();
    return readSSE(r,function(data){
      if(data==='[DONE]')return;
      try{var j=JSON.parse(data);if(j.error)throw new Error(j.error);var dc=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(dc){full+=dc;onChunk&&onChunk(dc);}}catch(e){if(e.message&&data.indexOf('error')>=0)throw e;}
    });
  }).then(function(){if(!full)throw new Error('未收到 AI 输出');return full;}).catch(function(e){
    if(e.message==='Failed to fetch')throw new Error('直连与后端代理均失败。APK 环境应可直连；浏览器预览需启动 backend（cd backend && node server.js）');
    throw e;
  });
}
/* 推导 chat/messages 端点 */
function deriveChatUrl(url,provider){
  var u=(url||'').trim().replace(/\/+$/,'');
  if(!u)return provider==='claude'?API_DEFAULTS.claude:API_DEFAULTS.openai;
  if(provider==='claude'){if(/\/messages$/.test(u))return u;if(!/\/v1$/.test(u))u+='/v1';return u+'/messages';}
  if(/\/chat\/completions$/.test(u)||/\/completions$/.test(u))return u;
  if(!/\/v1$/.test(u))u+='/v1';
  return u+'/chat/completions';
}
function callOpenAI(messages,onChunk,onConnected){
  var url=deriveChatUrl(CONFIG.apiUrl,'openai'),full='';
  // 严格按 new-api Chat Completions 文档发送，不经过自定义 XHR 或二进制转换。
  var payload={model:String(CONFIG.model||'').trim(),messages:messages};
  var bodyStr=JSON.stringify(payload);
  // 用 Blob 作为 body：Android WebView 发送字符串 body 时可能用 chunked 传输且不带
  // Content-Length，裸 IP 的 new-api 读不到 body 长度 → 预览端报 400、APP 端挂起。
  // Blob 有确定字节长度，会强制带上精确 Content-Length，避免 chunked。
  var bodyBlob=(typeof Blob!=='undefined')?new Blob([bodyStr],{type:'application/json'}):bodyStr;
  return fetchWithTimeout(url,{
    method:'POST',
    headers:{'Authorization':'Bearer '+CONFIG.apiKey,'Content-Type':'application/json'},
    body:bodyBlob
  }).then(function(r){
    return r.text().then(function(text){return {ok:r.ok,status:r.status,text:text};});
  }).then(function(r){
    if(!r.ok){
      var msg='HTTP '+r.status+': '+String(r.text).slice(0,300);
      if(/invalid JSON|request body|无效的请求|parse|unmarshal/i.test(r.text)){
        msg+='\n\n[诊断] fetch 原始请求体='+bodyStr+'\n目标='+url+'；Content-Type=application/json。';
      }
      throw new Error(msg);
    }
    var j;
    try{j=JSON.parse(r.text);}catch(e){throw new Error('响应解析失败：'+String(r.text).slice(0,300));}
    full=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    if(!full&&j.error)throw new Error(typeof j.error==='string'?j.error:(j.error.message||JSON.stringify(j.error)));
    if(!full)throw new Error('接口返回成功，但没有 choices[0].message.content');
    if(onConnected)onConnected();
    if(onChunk)onChunk(full);
    return full;
  });
}
function callClaude(messages,onChunk,onConnected){

/* 读取 SSE 流的通用工具 */
function readSSE(resp,onLine){
  var reader=resp.body.getReader(),dec=new TextDecoder(),buf='';
  return reader.read().then(function process(res){
    if(res.done)return;
    buf+=dec.decode(res.value,{stream:true});
    var lines=buf.split('\n');buf=lines.pop();
    lines.forEach(function(ln){ln=ln.trim();if(ln.indexOf('data:')===0)onLine(ln.slice(5).trim());});
    return reader.read().then(process);
  });
}
/* 基于 XMLHttpRequest 的 POST。JSON 必须作为字符串发送；浏览器会按 UTF-8 编码并设置正确的实体长度。
   返回 {ok,status,text}；网络错误 reject('Failed to fetch') 以保留 auto 模式回退代理的行为。 */
function xhrPost(url,headers,bodyStr,opts){
  opts=opts||{};
  var stream=!!opts.stream,onLine=opts.onLine,onConnected=opts.onConnected;
  var ms=(CONFIG.aiTimeoutMs>0?CONFIG.aiTimeoutMs:60000);
  return new Promise(function(resolve,reject){
    var xhr=new XMLHttpRequest();
    try{xhr.open('POST',url,true);}catch(e){reject(new Error('Failed to fetch'));return;}
    var hk=headers||{};for(var k in hk){if(hk.hasOwnProperty(k)){try{xhr.setRequestHeader(k,hk[k]);}catch(e){}}}
    var timedOut=false,connected=false,lastIdx=0,sseBuf='';
    var timer=setTimeout(function(){timedOut=true;try{xhr.abort();}catch(e){}},ms);
    CURRENT_AI_CTRL={abort:function(){try{xhr.abort();}catch(e){}}};
    function markConnected(){if(connected)return;connected=true;clearTimeout(timer);if(onConnected)onConnected();}
    function pump(){
      var txt=xhr.responseText||'';
      if(txt.length<=lastIdx)return;
      var chunk=txt.slice(lastIdx);lastIdx=txt.length;
      if(stream&&onLine){
        sseBuf+=chunk;
        var lines=sseBuf.split('\n');sseBuf=lines.pop();
        lines.forEach(function(ln){ln=ln.trim();if(ln.indexOf('data:')===0)onLine(ln.slice(5).trim());});
      }
    }
    xhr.onreadystatechange=function(){
      if(xhr.readyState===2){ // HEADERS_RECEIVED
        if(xhr.status>0&&xhr.status<400)markConnected();
      }
    };
    if(stream)xhr.onprogress=function(){if(xhr.status&&xhr.status>=400)return;pump();};
    xhr.onload=function(){
      clearTimeout(timer);
      if(stream&&xhr.status<400)pump();
      resolve({ok:xhr.status>=200&&xhr.status<300,status:xhr.status,text:xhr.responseText||''});
    };
    xhr.onerror=function(){clearTimeout(timer);reject(new Error('Failed to fetch'));};
    xhr.onabort=function(){
      clearTimeout(timer);
      if(timedOut){reject(new Error('连接超时：'+Math.round(ms/1000)+'s 内服务器未返回响应。请到「设置」核对 API 地址、协议与模型。'));}
      else{var e=new Error('__USER_CANCELLED__');e.userCancelled=true;reject(e);}
    };
    try{
      // 用 Blob 发送：Android WebView 发字符串 body 时可能走 chunked 且不带 Content-Length，
      // 裸 IP 的中转服务读不到长度 → 400/挂起。Blob 有确定字节长度，强制带精确 Content-Length。
      var payloadBody=(typeof Blob!=='undefined')?new Blob([bodyStr],{type:'application/json'}):bodyStr;
      xhr.send(payloadBody);
    }catch(e){clearTimeout(timer);reject(new Error('Failed to fetch'));}
  });
}

/* 原生桥获取模型（APK 环境，直连各家 /models 端点，原生栈无 CORS/chunked 问题） */
function modelsViaNative(provider,url,key){

    if(!/\/v1$/.test(ob))ob+='/v1';
    mu=ob+'/models';headers={'Authorization':'Bearer '+key};
  }
  return nativeHttpRaw('GET',mu,headers,'').then(function(t){
    var j;try{j=JSON.parse(t);}catch(e){throw new Error('返回非JSON: '+String(t).slice(0,150));}
    if(j.error)throw new Error(typeof j.error==='string'?j.error:(j.error.message||JSON.stringify(j.error)));
    if(provider==='gemini')return (j.models||[]).map(function(m){return (m.name||'').replace('models/','');}).filter(Boolean);

/* ==================== 第二通道（后台生成引擎） ====================
   仅用于生成「徒弟离线经历 / 新闻 / 商城商品 / 短信」等后台内容，非流式。
   独立于主通道，可配置不同的 provider/apiUrl/apiKey/model。
   离线门控：只有剧情日推进（存在离线窗口）时才允许改变徒弟处境/写危机经历。 */
var PHONE_REFRESHING=false;

/* 用指定配置发一次非流式请求，返回完整文本 */
function callWithConfig(cfg,messages){
  var provider=cfg.provider||'openai';
  // APK 原生桥环境：直接用原生 HTTP 发请求，无 chunked/CORS 问题
  if(hasNativeBridge()){
    return callViaNativeBridge(messages,null,null,cfg);
  }
  var backend=(CONFIG.backendUrl||'http://localhost:3001').replace(/\/+$/,'');
  // 统一走后端代理（后端无 CORS 限制、稳定），非流式
  return fetch(backend+'/api/ai/chat',{
    method:'POST',headers:cloudProxyHeaders(),
    body:JSON.stringify({provider:provider,apiUrl:cfg.apiUrl,apiKey:cfg.apiKey,model:cfg.model,messages:messages,temperature:0.9,topP:0.95,maxTokens:cfg.maxTokens||2048,stream:false})
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('第二通道 HTTP '+r.status+': '+(t.slice(0,150)||'服务器返回错误，请核对第二通道的 API Key/模型/地址')); });
    // 后端始终以 SSE 回传，这里聚合
    var full='';
    return readSSE(r,function(data){
      if(data==='[DONE]')return;
      try{var j=JSON.parse(data);if(j.error)throw new Error(j.error);var dc=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(dc)full+=dc;}catch(e){if(e.message&&data.indexOf('error')>=0)throw e;}
    }).then(function(){if(!full)throw new Error('第二通道未收到任何输出，可能是模型名错误或该模型无返回，请核对模型名。');return full;});
  }).catch(function(e){
    // 网络层错误：地址不可达/DNS 失败/连接被拒/后端未启动
    if(e&&(e.name==='TypeError'||/Failed to fetch|NetworkError|Load failed/i.test(e.message||''))){
      throw new Error('第二通道无法连接：地址不可达或后端未启动。请检查第二通道 API 地址，浏览器预览需先启动 backend。');
    }
    throw e;
  });
}

/* 打开手机：按需触发后台生成。
   频率门控（省 token）：首次打开必生成；此后每 CONFIG.ch2Interval 个 AI 轮次才再生成一次，
   未到轮次则直接用现有缓存内容，不发请求。
   通道选择：
   1) 第二通道已选模型并可连接（启用+Key+模型）→ 用第二通道；
   2) 第二通道未配好 → 直接用主 API（不报错，正常代生成）；
   3) 第二通道运行时连接失败 → 警告并切换主通道（非报错）。 */
function refreshPhone(triggerPage){
  if(PHONE_REFRESHING)return;
  // 生成未完成时不触发后台更新：主通道正生成正文/创建徒弟时，STATE 处于半更新态，
  // 此时再发后台请求会与主生成争用状态并可能读到未就绪数据而报错。直接跳过，只提示。
  if((typeof GEN_STATE!=='undefined'&&GEN_STATE.active)||(typeof CREATE_STATE!=='undefined'&&CREATE_STATE.active)){
    setApiStatus(2,'idle','等待正文生成');
    return;
  }
  // 步骤1：第二通道是否已选择模型并可连接
  var ch2Ready=!!(CONFIG.ch2Enabled&&CONFIG.ch2ApiKey&&CONFIG.ch2Model);
  // 步骤2：主通道是否可用（第二通道没配好时的后备）
  var mainReady=aiReady();
  if(!ch2Ready&&!mainReady)return;   // 无任何可用通道，静默跳过
  // 频率门控：首次必生成，之后按 AI 轮次间隔
  var curTurn=(typeof STORY!=='undefined'&&STORY.history)?STORY.history.length:0;
  var interval=(CONFIG.ch2Interval>0?CONFIG.ch2Interval:1);
  var firstTime=!STATE.phone.generated;
  var due=firstTime||(interval<=1)||((curTurn-(STATE.phone.genTurn||0))>=interval);
  if(!due)return;   // 未到更新轮次：沿用现有后台内容，不消耗 token
  var offline=STATE.meta.day>(STATE.phone.lastCheckDay||0);
  var fullShopRefresh=STATE.meta.day>(STATE.phone.shopDay||0);
  var shopRefresh=prepareShopRefresh(fullShopRefresh);
  PHONE_REFRESHING=true;
  var useCh2=ch2Ready;               // 第二通道就绪则优先用它，否则直接用主通道
  var cfg=useCh2?{provider:CONFIG.ch2Provider,apiUrl:CONFIG.ch2ApiUrl,apiKey:CONFIG.ch2ApiKey,model:CONFIG.ch2Model,maxTokens:CONFIG.maxTokens}
               :{provider:CONFIG.provider,apiUrl:CONFIG.apiUrl,apiKey:CONFIG.apiKey,model:CONFIG.model,maxTokens:CONFIG.maxTokens};
  var chanName=useCh2?'第二通道':'主通道';
  // 后台生成始终反映在 api2 行（第二通道职责；未配置时由主通道代生成）
  setApiStatus(2,'connecting',useCh2?'正在连接':'正在连接（主通道代生成）');
  var messages=buildPhonePrompt(offline,shopRefresh.plan);
  showPhoneToast('🔄 徒弟系统后台更新中（'+chanName+'）…');
  var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error(chanName+'连接超时（60s 未响应），可能是地址/协议/模型不匹配导致对端挂起。'));},60000);});
  function markDone(){
    STATE.phone.generated=true;STATE.phone.genTurn=curTurn;STATE.phone.lastCheckDay=STATE.meta.day;
    if(fullShopRefresh)STATE.phone.shopDay=STATE.meta.day;
  }
  function applyPhoneResult(full){stripAndParseState(full,'phone');finishShopRefresh();markDone();}
  setApiStatus(2,'updating',useCh2?'正在更新':'正在更新（主通道代生成）');
  Promise.race([callWithConfig(cfg,messages),timeout]).then(function(full){
    applyPhoneResult(full);
    refreshAll();
    setApiStatus(2,'done');
    showPhoneToast('✅ 后台更新完成');
  }).catch(function(e){
    // 第二通道连接失败且主通道可用 → 警告切换主通道（非报错），再生成一次
    if(useCh2&&mainReady){
      setApiStatus(2,'connecting','第二通道未连接，切换主 API');
      showPhoneToast('⚠️ 第二通道未连接，已切换到主 API 生成');
      var mainCfg={provider:CONFIG.provider,apiUrl:CONFIG.apiUrl,apiKey:CONFIG.apiKey,model:CONFIG.model,maxTokens:CONFIG.maxTokens};
      setApiStatus(2,'updating','主通道代生成中');
      callWithConfig(mainCfg,messages).then(function(full){
        applyPhoneResult(full);refreshAll();setApiStatus(2,'done','已完成（主通道代生成）');showPhoneToast('✅ 后台更新完成（主通道代生成）');
      }).catch(function(e2){SHOP_REFRESH_CTX=null;setApiStatus(2,'fail','更新失败');showPhoneToast('❌ 后台更新失败：'+((e2&&e2.message)||'未知错误'));}).then(function(){PHONE_REFRESHING=false;});
      return;
    }
    // 无后备通道（本就用主通道，或第二通道无主通道兜底）→ 报出真实原因
    SHOP_REFRESH_CTX=null;
    setApiStatus(2,'fail','更新失败');
    showPhoneToast('❌ 后台更新失败：'+((e&&e.message)||'未知错误'));
  }).then(function(){if(!(useCh2&&mainReady))PHONE_REFRESHING=false;});
}
function showPhoneToast(msg){
  var el=document.getElementById('phone-toast');
  if(!el){el=document.createElement('div');el.id='phone-toast';el.className='chat-toast';el.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:9999';document.body.appendChild(el);}
  el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},2000);
}
/* 手机侧边栏底部双通道状态条：channel=1(主通道 api1)/2(第二通道 api2)；
   state=idle/connecting/updating/done/fail；text 可选自定义文案，缺省用状态默认词。 */
function setApiStatus(channel,state,text){
  var row=document.getElementById('pas-row-'+channel),tx=document.getElementById('pas-text-'+channel);
  if(!row||!tx)return;
  var def={idle:'空闲',connecting:'正在连接',updating:'正在更新',done:'已完成',fail:'连接失败'};
  row.className='pas-row st-'+state;
  tx.textContent=text||def[state]||state;
}
