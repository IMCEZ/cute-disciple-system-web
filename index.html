function l2dLoadScript(src){
  return new Promise(function(resolve,reject){
    if(document.querySelector('script[src="'+src+'"]')){resolve();return;}
    var s=document.createElement('script');s.src=src;s.async=false;
    s.onload=resolve;
    s.onerror=function(){reject(new Error('脚本加载失败: '+src));};
    (document.head||document.body).appendChild(s);
  });
}
function l2dWaitFor(cond,timeout,interval){
  return new Promise(function(resolve){
    var waited=0;interval=interval||60;timeout=timeout||3000;
    (function tick(){
      var ok=false;try{ok=!!cond();}catch(_){ok=false;}
      if(ok){resolve(true);return;}
      waited+=interval;
      if(waited>=timeout){resolve(false);return;}
      setTimeout(tick,interval);
    })();
  });
}
async function l2dLoadScriptRace(cands,validate){
  var lastErr=null;
  for(var i=0;i<cands.length;i++){
    try{
      await l2dLoadScript(cands[i]);
      if(typeof validate==='function'){
        var ready=await l2dWaitFor(validate,3000,60);
        if(!ready){lastErr=new Error('镜像内容无效: '+cands[i]);continue;}
      }
      return cands[i];
    }catch(e){lastErr=e;}
  }
  throw (lastErr||new Error('全部镜像均加载失败'));
}
function l2dProbeUrl(url){
  return fetch(url,{method:'HEAD'}).then(function(r){return r.ok;}).catch(function(){return false;});
}
async function l2dFindCore(cands){
  for(var i=0;i<cands.length;i++){var ok=await l2dProbeUrl(cands[i]);if(ok)return cands[i];}
  return cands[cands.length-1];
}
async function l2dInit(canvasId,modelUrl){
  if(_l2dLoading)return;
  _l2dLoading=true;
  try{
    var probeModel=modelUrl||L2D_MODEL_CANDIDATES[0];
    var isCubism2=/\.model\.json(\?|$)/i.test(probeModel)&&!/\.model3\.json/i.test(probeModel);
    if(isCubism2){var core2=await l2dFindCore(L2D_CORE2_CANDIDATES);await l2dLoadScript(core2);}
    else{var core4=await l2dFindCore(L2D_CORE4_CANDIDATES);await l2dLoadScript(core4);}
    await l2dLoadScriptRace(L2D_LIB.pixi,function(){var P=(typeof PIXI!=='undefined')?PIXI:window.PIXI;return !!(P&&P.Application);});
    window.PIXI=window.PIXI||(typeof PIXI!=='undefined'?PIXI:null);
    if(!window.PIXI||!window.PIXI.Application){throw new Error('PIXI 加载失败（镜像不可用）');}
    var displayCands=isCubism2?L2D_LIB.display2:L2D_LIB.display4;
    await l2dLoadScriptRace(displayCands,function(){var P=window.PIXI||((typeof PIXI!=='undefined')?PIXI:null);return !!(P&&P.live2d&&P.live2d.Live2DModel);});
    window.PIXI=window.PIXI||((typeof PIXI!=='undefined')?PIXI:null);
    if(!(window.PIXI&&window.PIXI.live2d&&window.PIXI.live2d.Live2DModel)){throw new Error('Live2D 库加载失败（全部镜像内容无效）');}
    try{if(window.PIXI.live2d.Live2DModel&&window.PIXI.Ticker)window.PIXI.live2d.Live2DModel.registerTicker(window.PIXI.Ticker);}catch(_){}
    var canvas=document.getElementById(canvasId);
    if(!canvas)return;
    l2dDestroy();
    var box=canvas.parentNode;
    var cw=(box&&box.clientWidth)||canvas.clientWidth||300;
    var ch=(box&&box.clientHeight)||canvas.clientHeight||280;
    _l2dApp=new window.PIXI.Application({view:canvas,width:cw,height:ch,backgroundAlpha:0,antialias:true,autoDensity:true,resolution:window.devicePixelRatio||1});
    var modelUrls=modelUrl?[modelUrl]:L2D_MODEL_CANDIDATES;
    var lastErr=null;_l2dModel=null;
    for(var mi=0;mi<modelUrls.length;mi++){
      try{_l2dModel=await window.PIXI.live2d.Live2DModel.from(modelUrls[mi],{autoInteract:true,motionPreload:'IDLE'});break;}
      catch(me){lastErr=me;}
    }
    if(!_l2dModel)throw (lastErr||new Error('模型加载失败'));
    _l2dApp.stage.addChild(_l2dModel);
    var vw=cw,vh=ch,mw=_l2dModel.width||0;
    var scale=(mw>0)?(vw/mw)*1.7:0.12;
    if(!isFinite(scale)||scale<=0)scale=0.12;
    _l2dModel.scale.set(scale);
    _l2dModel.anchor.set(0.5,0.12);
    _l2dModel.position.set(vw/2,vh*0.06);
    try{_l2dModel.motion('Idle');}catch(_){}
    l2dSetExpression(STATE.disciple.emotion||'calm');
  }catch(e){
    console.error('[徒弟系统] Live2D 加载失败',e);
    var cv2=document.getElementById(canvasId);
    var msg=(e&&e.message)||'未知错误';
    var hint=/CORS|cross|fetch|network|Failed to fetch|加载失败/i.test(msg)
      ?'资源加载失败<br>可能是网络问题，请检查网络或稍后重试<br>自定义模型请用支持 CORS 的托管'
      :'请检查模型 URL 是否为可访问的 .model3.json';
    if(cv2&&cv2.parentNode)cv2.parentNode.innerHTML='<div style="color:var(--text-3);font-size:12px;text-align:center;padding:20px;line-height:1.7;">Live2D 加载失败<br>'+hint+'<br><span style="opacity:.6;font-size:11px;">'+esc(msg)+'</span></div>';
  }finally{_l2dLoading=false;}
}

  try{if(_l2dApp){_l2dApp.destroy(true,{children:true,texture:true,baseTexture:true});_l2dApp=null;}}catch(_){}

    var em=mm&&mm.expressionManager;
    if(!em)return [];
    var defs=em.definitions||em._expressions||[];

  }catch(_){return [];}

function l2dSetExpression(emotionKey){
  if(!_l2dModel)return;
  try{
    var exprName=L2D_EXPR_MAP[emotionKey];
    var avail=l2dExprList();
    if(avail.length){
      var cands=L2D_EXPR_ALIAS[emotionKey]||[];var hit=null;
      for(var i=0;i<cands.length&&!hit;i++){
        var c=cands[i].toLowerCase();
        for(var j=0;j<avail.length;j++){if(avail[j].toLowerCase().indexOf(c)>=0){hit=avail[j];break;}}
      }
      if(hit){_l2dModel.expression(hit);return;}
      if(emotionKey==='calm'){_l2dModel.expression();return;}
      return;
    }
    if(exprName)_l2dModel.expression(exprName);else _l2dModel.expression();
  }catch(_){}
}

/* ==================== v0.6 状态解析引擎 ==================== */
/* 从 AI 输出提取 <状态>...</状态> 块，解析 _.set(路径,值...) 指令并应用到 STATE。
   返回剔除状态块后的纯正文。 */
function stripAndParseState(raw,source){
  if(!raw)return '';
  var text=raw;
  // 提取所有 <状态>...</状态> 块
  var re=/<状态>([\s\S]*?)<\/状态>/g,m;
  var blocks=[];
  while((m=re.exec(raw))!==null){blocks.push(m[1]);}
  // 从正文中剔除状态块与 History 自动记忆块
  text=raw.replace(/<状态>[\s\S]*?<\/状态>/g,'').replace(/<History>[\s\S]*?<\/History>/gi,'').trim();
  if(source!=='phone')parseHistoryAutomation(raw);
  // 解析并剔除成就声明 <成就 id="XXX" 对象="YYY" 名称="ZZZ"/>
  var achRe=/<成就\s+([^>]*?)\/?>/g,am;
  while((am=achRe.exec(text))!==null){
    var attr=am[1],id=(attr.match(/id\s*=\s*["']([^"']+)["']/)||[])[1];
    var nm=(attr.match(/(?:名称|name)\s*=\s*["']([^"']+)["']/)||[])[1];
    var obj=(attr.match(/(?:对象|object)\s*=\s*["']([^"']+)["']/)||[])[1];
    if(id)addAch(id,nm||id,obj||'');
  }
  text=text.replace(/<成就\s+[^>]*?\/?>/g,'').trim();
  // 逐块逐行解析 _.set(...)
  blocks.forEach(function(blk){
    var setRe=/_\.set\(([^)]*)\)/g,sm;
    while((sm=setRe.exec(blk))!==null){
      var args=splitArgs(sm[1]);
      if(args.length>=2)applySet(args,source);
    }
  });
  return text;
}
/* 拆分 _.set(a, b, c) 的参数，去引号去空格 */
function splitArgs(s){
  return s.split(',').map(function(x){return x.trim().replace(/^["'「]|["'」]$/g,'').trim();});
}
/* 第二通道(source==='phone')禁写的锁定身份字段：核心身份由主通道确立并永久锁定，防跑偏 */
var PHONE_LOCKED_PATHS={'disciple.name':1,'disciple.age':1,'disciple.appearance':1,'disciple.personality':1,'disciple.world':1,'disciple.plight':1,'disciple.cognitionType':1,'disciple.realm':1};
/* 应用单条 set 指令。source: 'phone'=第二通道后台生成（受数据锁约束）| 其它/空=主通道正文 */
function applySet(args,source){
  var path=args[0],val=args[1],extra=args.slice(2);
  // 数据锁：第二通道不得改写核心身份字段（即便 AI 违规输出也在此丢弃）
  if(source==='phone'&&PHONE_LOCKED_PATHS[path])return;
  try{
    // ---- meta ----
    if(path==='meta.day')STATE.meta.day=parseInt(val)||STATE.meta.day;
    else if(path==='meta.period')STATE.meta.period=val;
    else if(path==='meta.place')STATE.meta.place=val;
    else if(path==='meta.cognition')STATE.meta.cognition=val;
    // ---- host 好感 / 经济 ----
    else if(path==='host.aff'||path==='aff')addAff(parseSigned(val));
    else if(path==='host.rebate'){var amt=parseInt(val)||0;STATE.host.balance+=amt;STATE.walletRec.unshift({icon:'📥',name:extra[0]||'返利',amount:'+'+amt,time:'第'+STATE.meta.day+'日'});}
    else if(path==='host.spend'){var sp=parseInt(val)||0;STATE.host.balance-=sp;STATE.walletRec.unshift({icon:'📤',name:extra[0]||'消费',amount:'-'+sp,time:'第'+STATE.meta.day+'日'});}
    // ---- 徒弟身份/状态 ----
    else if(path==='disciple.name')STATE.disciple.name=val;
    else if(path==='disciple.age')STATE.disciple.age=val;
    else if(path==='disciple.appearance')STATE.disciple.appearance=val;
    else if(path==='disciple.personality')STATE.disciple.personality=val;
    else if(path==='disciple.world')STATE.disciple.world=val;
    else if(path==='disciple.plight')STATE.disciple.plight=val;
    else if(path==='disciple.realm')STATE.disciple.realm=val;
    else if(path==='disciple.emotion'){STATE.disciple.emotion=val;if(CONFIG.l2dEnabled&&l2dPageOpen())l2dSetExpression(val);}
    else if(path==='disciple.mood')STATE.disciple.mood=val;
    else if(path==='disciple.status')STATE.disciple.status=val;
    else if(path==='disciple.storyline')STATE.disciple.storyline=val;
    else if(path==='disciple.locale')STATE.disciple.locale=val;
    // ---- 三维成长（支持增量 +N/-N 或绝对值）----
    else if(path==='disciple.cultivation')addStat('cultivation',val);
    else if(path==='disciple.mind'||path==='disciple.mindset')addStat('mind',val);
    else if(path==='disciple.fortune')addStat('fortune',val);
    else if(path==='disciple.breakthrough')STATE.disciple.breakthrough=val;
    // ---- 关系阶段线（独立于好感）----
    else if(path==='disciple.relStage'||path==='rel.stage'){setRelStage(val);}
    else if(path==='disciple.relUnlock'||path==='rel.unlock'){STATE.disciple.rel.unlock=(val==='true'||val==='1'||val==='是');}
    // ---- 世界 / 宿主阶段 ----
    else if(path==='world.stage'||path==='worldStage')STATE.world.stage=val;
    else if(path==='host.stage'||path==='hostStage')STATE.host.stage=val;
    // ---- 道具 / 随身物 ----
    else if(path==='item')addItem(val,extra[0],extra[1]);
    else if(path==='belonging')addBelonging(val,extra[0],extra[1],extra[2]);
    // ---- 送礼选项（由 AI 下发可选礼物）：gift(名,效果,图标) ----
    else if(path==='gift')addGift(val,extra[0],extra[1]);
    // ---- 商城商品：shop(名,描述,价格,图标) ----
    else if(path==='shop')addShop(val,extra[0],extra[1],extra[2],extra[3]);
    // ---- 新闻：news(标题,标签,时间) ----
    else if(path==='news')addNews(val,extra[0],extra[1]);
    // ---- 短信：sms(发件人,内容,时间) ----
    else if(path==='sms')addSms(val,extra[0],extra[1]);
    // ---- 徒弟离线经历：backlog(文字) ----
    else if(path==='backlog')addBacklog(val);
    // ---- 成就：ach(id,名称,描述) ----
    else if(path==='ach')addAch(val,extra[0],extra[1]);
    // ---- NPC ----
    else if(path.indexOf('npc.')===0){
      var seg=path.split('.'),nm=seg[1],field=seg[2]||'dynamic';
      if(!STATE.npc[nm])STATE.npc[nm]={relation:'',dynamic:''};
      if(field==='relation'&&!STATE.npc[nm].relation)STATE.npc[nm].relation=val;
      else if(field==='dynamic')STATE.npc[nm].dynamic=val;
    }
    // ---- bond ----
    else if(path==='bond.pactItem')STATE.bond.pactItem=val;
    else if(path==='bond.pactDay')STATE.bond.pactDay=parseInt(val)||0;
    else if(path==='bond.tier')STATE.bond.tier=parseInt(val)||STATE.bond.tier;
    else if(path==='bond.evt'){var eid=extra[0]||val;if(eid&&STATE.bond.events.indexOf(eid)<0)STATE.bond.events.push(eid);}
  }catch(e){console.warn('applySet失败',path,e);}
}

/* 好感增减，含升级（每级100） */
function addAff(delta){

  while(a.value<0&&a.level>0){a.level--;a.value+=a.max;}

  a.name=affName(a.level);
}
function affName(lv){var names=['素不相识','萍水相逢','渐生好感','情意暗生','两情相悦','情根深种','道侣同心'];return names[Math.min(lv,names.length-1)];}
/* 三维：+N/-N 增量 或 绝对数 */

}

var ITEM_GRADE_NAMES=['凡品·下','凡品·中','凡品·上','灵品·下','灵品·中','灵品·上','宝品·下','宝品·中','宝品·上','仙品·下','仙品·中','神品'];
function itemGradeFromPrice(price){
  var p=parseInt(price)||0;
  if(p<=5)return 1;if(p<=15)return 2;if(p<=30)return 3;
  if(p<=60)return 4;if(p<=120)return 5;if(p<=250)return 6;
  if(p<=500)return 7;if(p<=1000)return 8;if(p<=2000)return 9;
  if(p<=5000)return 10;if(p<=10000)return 11;return 12;
}

  if(ex)ex.count=q;else STATE.belongings.push({icon:'🎒',name:name,count:q});
}
/* 关系阶段线：支持数字(1-6)或阶段名 */
var REL_NAMES=['陌生','依赖','仰慕','倾心','挚爱','道侣'];
function setRelStage(val){
  var r=STATE.disciple.rel,n;
  if(/^\d+$/.test(val)){n=parseInt(val);}
  else{var idx=REL_NAMES.indexOf(val);n=idx>=0?idx+1:r.stage;}

/* 商城商品：固定 5 个槽位（1高级、2中级、2低级），低级限购量更多。 */
var SHOP_REFRESH_CTX=null;
function shopTierName(tier){return tier==='high'?'高级':(tier==='mid'?'中级':'低级');}
function shopTierFromGrade(grade){grade=parseInt(grade)||1;return grade>=9?'high':(grade>=5?'mid':'low');}
function shopGradeForTier(tier,price){
  var inferred=itemGradeFromPrice(price);
  if(tier==='high')return Math.max(9,Math.min(12,inferred));
  if(tier==='mid')return Math.max(5,Math.min(8,inferred));
  return Math.max(1,Math.min(4,inferred));
}
function shopLimitByTier(tier){return tier==='high'?1:(tier==='mid'?2:4);}
function shopRefreshPlan(fullRefresh){
  var plan=[];
  if(fullRefresh||!STATE.shop.length){return ['high','mid','mid','low','low'];}
  STATE.shop.slice(0,5).forEach(function(item){if((item.stock||0)<=0)plan.push(item.tier||shopTierFromGrade(item.grade||itemGradeFromPrice(item.price)));});
  return plan;
}
function prepareShopRefresh(fullRefresh){
  var old=Array.isArray(STATE.shop)?STATE.shop.slice(0,5):[];
  var keep=fullRefresh?[]:old.filter(function(item){return (item.stock||0)>0;});
  SHOP_REFRESH_CTX={full:!!fullRefresh,old:old,keep:keep,incoming:[],plan:shopRefreshPlan(fullRefresh)};
  return SHOP_REFRESH_CTX;
}
function finishShopRefresh(){
  var ctx=SHOP_REFRESH_CTX;if(!ctx)return;
  var result=[];
  if(ctx.full){
    result=ctx.incoming.slice(0,5);
    ctx.old.forEach(function(item){if(result.length<5&&!result.some(function(x){return x.name===item.name;}))result.push(item);});
  }else{
    var incomingIndex=0;
    ctx.old.forEach(function(item){result.push((item.stock||0)>0?item:(ctx.incoming[incomingIndex++]||item));});
    while(result.length<5&&incomingIndex<ctx.incoming.length)result.push(ctx.incoming[incomingIndex++]);
  }
  STATE.shop=result.slice(0,5);SHOP_REFRESH_CTX=null;
}
function addShop(name,desc,price,icon,tier){
  if(!name)return;
  var p=parseInt(price)||0,ctx=SHOP_REFRESH_CTX;
  tier=String(tier||'').trim().toLowerCase();
  if(tier==='高级'||tier==='高')tier='high';else if(tier==='中级'||tier==='中')tier='mid';else if(tier==='低级'||tier==='低')tier='low';
  if(!/^(high|mid|low)$/.test(tier))tier=(ctx&&ctx.plan[ctx.incoming.length])||shopTierFromGrade(itemGradeFromPrice(p));
  var g=shopGradeForTier(tier,p),limit=shopLimitByTier(tier);
  var item={icon:icon||'🛍️',name:name,desc:desc||'',price:p,tier:tier,grade:g,limit:limit,stock:limit};
  if(ctx){
    var wanted=ctx.plan[ctx.incoming.length];
    if(!wanted||ctx.incoming.length>=ctx.plan.length)return;
    item.tier=wanted;item.grade=shopGradeForTier(wanted,p);item.limit=shopLimitByTier(wanted);item.stock=item.limit;
    ctx.incoming.push(item);return;
  }
  var ex=STATE.shop.find(function(s){return s.name===name;});
  if(ex)Object.assign(ex,item);else if(STATE.shop.length<5)STATE.shop.push(item);
}

function normalizeContactName(name){return String(name||'').trim().toLowerCase();}
function addSms(from,content,time){
  from=String(from||'').trim();
  if(!from)return;
  if(!Array.isArray(STATE.smsBlacklist))STATE.smsBlacklist=[];
  if(STATE.smsBlacklist.some(function(name){return normalizeContactName(name)===normalizeContactName(from);})){return;}
  // 同发件人：追加到已有线程的消息列表
  var thread=STATE.sms.find(function(t){return t.from===from;});
  if(thread){
    thread.preview=content||thread.preview;
    thread.time=time||('第'+STATE.meta.day+'日');
    thread.unread=true;
    thread.msgs.push({role:'them',text:content||'',time:time||('第'+STATE.meta.day+'日')});
    // 置顶
    STATE.sms=STATE.sms.filter(function(t){return t.from!==from;});
    STATE.sms.unshift(thread);
  }else{
    STATE.sms.unshift({from:from,preview:content||'',unread:true,time:time||('第'+STATE.meta.day+'日'),
      msgs:[{role:'them',text:content||'',time:time||('第'+STATE.meta.day+'日')}]});
  }
  if(STATE.sms.length>40)STATE.sms.length=40;
}

/* ==================== 多存档系统 ==================== */
/* 存档结构：localStorage['dz_saves'] = [{id,name,day,updated,STATE,story}]
   当前激活存档 id 存于 localStorage['dz_slot']。自动保存写入当前存档。 */
var CUR_SLOT=null;
function loadSaves(){try{var s=localStorage.getItem('dz_saves');return s?JSON.parse(s):[];}catch(e){return [];}}
function writeSaves(arr){try{localStorage.setItem('dz_saves',JSON.stringify(arr));}catch(e){}}
function snapshot(){return {STATE:STATE,story:{started:STORY.started,history:STORY.history,historySnapshots:STORY.historySnapshots||[],day:STORY.day},chat:CHAT_HISTORY.slice()};}
/* 保存到当前存档槽（自动保存调用）。无当前槽则不写。 */
function saveState(){

/* ==================== 统一自定义弹窗（替代原生 alert/confirm） ====================
   dzAlert(msg,opts?) → Promise，仅一个「确定」按钮。
   dzConfirm(msg,opts?) → Promise<boolean>，确定 resolve(true)，取消 resolve(false)。
   opts: {title, okText, cancelText, tone:'default'|'warn'|'danger', icon} */
function dzDialog(opts){
  opts=opts||{};
  return new Promise(function(resolve){
    var tone=opts.tone||'default';
    var iconName=opts.icon||(tone==='danger'?'trash':(tone==='warn'?'zap':'sparkles'));
    var mask=document.createElement('div');
    mask.className='dz-dialog-mask';
    var confirmMode=!!opts.confirm;
    var html='<div class="dz-dialog" role="dialog" aria-modal="true">'+
      '<div class="dz-dialog-icon '+(tone==='default'?'':tone)+'">'+svgIcon(iconName,24)+'</div>'+
      (opts.title?'<div class="dz-dialog-title">'+escHtml(opts.title)+'</div>':'')+
      '<div class="dz-dialog-msg">'+escHtml(opts.msg||'')+'</div>'+
      '<div class="dz-dialog-btns">'+
        (confirmMode?'<button class="dz-dialog-btn ghost" data-act="cancel">'+escHtml(opts.cancelText||'取消')+'</button>':'')+
        '<button class="dz-dialog-btn primary'+(tone==='danger'?' danger':'')+'" data-act="ok">'+escHtml(opts.okText||'确定')+'</button>'+
      '</div>'+
    '</div>';
    mask.innerHTML=html;
    document.body.appendChild(mask);
    hydrateIcons(mask);
    // 强制回流后加 open，触发过渡动画
    requestAnimationFrame(function(){mask.classList.add('open');});
    var done=false;
    function close(val){
      if(done)return;done=true;
      mask.classList.remove('open');
      setTimeout(function(){if(mask.parentNode)mask.parentNode.removeChild(mask);},260);
      resolve(val);
    }
    mask.addEventListener('click',function(e){
      var act=e.target&&e.target.getAttribute&&e.target.getAttribute('data-act');
      if(act==='ok')close(true);
      else if(act==='cancel')close(false);
      else if(e.target===mask&&confirmMode)close(false);   // 点遮罩=取消（仅 confirm）
    });
  });
}
function dzAlert(msg,opts){opts=opts||{};opts.msg=msg;opts.confirm=false;if(!opts.title)opts.title='提示';return dzDialog(opts);}
function dzConfirm(msg,opts){opts=opts||{};opts.msg=msg;opts.confirm=true;if(!opts.title)opts.title='请确认';return dzDialog(opts);}

/* ==================== 渲染引擎：正则脚本 + Markdown + HTML ====================
   参考 SillyTavern：正则脚本以 {findRegex:"/pat/flags", replaceString, disabled,
   promptOnly, markdownOnly, placement} 描述。display 侧渲染前应用「显示类」脚本，
   构建 prompt 前应用「提示类」脚本。 */
var REGEX_SCRIPTS=[];   // 用户导入/编辑的正则脚本

/* 解析 "/pattern/flags" 字面量为 RegExp；容错：无斜杠则当作普通模式（全局） */
function parseRegexLiteral(str){
  if(!str)return null;
  var s=String(str);
  var m=s.match(/^\/([\s\S]*)\/([a-z]*)$/i);
  try{
    if(m)return new RegExp(m[1],m[2]||'');
    return new RegExp(s,'g');
  }catch(e){return null;}
}
/* 判断脚本在某侧是否生效。mode: 'display' | 'prompt'
   ST 语义：markdownOnly→仅显示侧；promptOnly→仅提示侧；两者皆无→两侧都跑；两者皆有→两侧都跑 */
function regexRunsOn(sc,mode){
  if(sc.disabled)return false;
  var md=!!sc.markdownOnly,pr=!!sc.promptOnly;
  if(mode==='display')return md||!pr;
  return pr||!md;   // prompt
}
/* 对文本应用一组正则脚本 */
function applyRegexScripts(text,mode){
  if(!CONFIG.regexEnabled||!REGEX_SCRIPTS.length)return text;
  var out=text;
  REGEX_SCRIPTS.forEach(function(sc){
    if(!regexRunsOn(sc,mode))return;
    var re=parseRegexLiteral(sc.findRegex);if(!re)return;
    var rep=(sc.replaceString!=null?sc.replaceString:'');
    try{out=out.replace(re,rep);}catch(e){}
  });
  return out;
}

/* ---- 轻量 Markdown 渲染器 ---- */
/* 行内元素：粗斜体/粗体/斜体/删除线/行内代码/链接/图片。allowHtml=false 时先转义 */
function mdInline(s){
  return s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,'<img alt="$1" src="$2" style="max-width:100%;border-radius:8px">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
      // 引号着色（保留引号符号本身）：全角双引号、半角双引号、«»、「」、『』
  .replace(/\u201c([^\u201d\n]*)\u201d/g,'<span class="dz-quote">\u201c$1\u201d</span>')
  .replace(/\u201e([^\u201c\n]*)\u201c/g,'<span class="dz-quote">\u201e$1\u201c</span>')
  .replace(/«([^»\n]*)»/g,'<span class="dz-quote">«$1»</span>')
  .replace(/\u300c([^\u300d\n]*)\u300d/g,'<span class="dz-quote">\u300c$1\u300d</span>')
  .replace(/\u300e([^\u300f\n]*)\u300f/g,'<span class="dz-quote">\u300e$1\u300f</span>')
  // allowHtml=true 时的半角直引号
  .replace(/(?<!=)"([^"\n]+)"/g,'<span class="dz-quote">"$1"</span>')
  // allowHtml=false 时 escHtml 已把 " 转为 "，单独处理
  .replace(/(?<!=)"([^<\n]+?)"/g,'<span class="dz-quote">"$1"</span>');
}
/* ---- 酒馆助手式 HTML 渲染：代码块内 HTML → 沙箱 iframe（支持 JS 执行） ---- */
var DZ_FRAME_SEQ=0;
/* 判断一段代码是否为可渲染 HTML */
function looksLikeHtml(lang,code){
  if(/^html?$/i.test(lang))return true;
  if(lang&&!/^(html?|xml|svg)$/i.test(lang))return false; // 明确标了别的语言 → 当代码展示
  // 无语言标记：内容含成对标签或典型块级/交互标签才判为 HTML
  return /<([a-z][a-z0-9]*)(\s[^>]*)?>[\s\S]*<\/\1>/i.test(code)||
         /<(div|span|style|script|button|section|table|img|iframe|svg|canvas|input|form|a|h[1-6]|ul|ol|p|details|video|audio)[\s>\/]/i.test(code);
}
/* 把 HTML 包进沙箱 iframe（srcdoc），注入自适应高度脚本 */
function htmlFrame(rawHtml){
  var id='dzf'+(++DZ_FRAME_SEQ)+'_'+Date.now();
  var resize='(function(){function s(){try{var h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,document.body.offsetHeight);parent.postMessage({__dzFrame:"'+id+'",height:h},"*");}catch(e){}}window.addEventListener("load",s);if(window.ResizeObserver){try{new ResizeObserver(s).observe(document.documentElement);}catch(e){}}document.addEventListener("click",function(){setTimeout(s,50);});setTimeout(s,60);setTimeout(s,300);setTimeout(s,1000);})();';
  var doc='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank">'+
    '<style>html,body{margin:0;padding:0;background:transparent;color:#e8e8ec;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;word-break:break-word}*{box-sizing:border-box}img{max-width:100%}a{color:#a89bff}</style>'+
    '</head><body>'+rawHtml+
    '<scr'+'ipt>'+resize+'</scr'+'ipt>'+
    '</body></html>';
  return '<iframe class="dz-html-frame" id="'+id+'" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals" srcdoc="'+escHtml(doc)+'" style="width:100%;border:0;display:block;min-height:40px"></iframe>';
}
/* iframe 高度自适应：监听子帧上报（全局仅注册一次） */
if(typeof window!=='undefined'&&!window.__dzFrameListener){
  window.__dzFrameListener=true;
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||!d.__dzFrame)return;
    var f=document.getElementById(d.__dzFrame);
    if(f&&d.height>0)f.style.height=(d.height+4)+'px';

}
/* 块级 Markdown → HTML。allowHtml=true 时原样保留 HTML，不转义。
   liveFrame=false 时 HTML 代码块只显示占位（用于流式中途，避免 iframe 反复重载） */
function markdownToHtml(text,allowHtml,liveFrame){
  var src=String(text||'').replace(/\r\n?/g,'\n');
  // 保护围栏代码块：HTML 代码块 → 沙箱 iframe 渲染；其它 → 代码展示
  var fences=[];
  src=src.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g,function(_,lang,code){
    var raw=code.replace(/\n$/,'');
    if(allowHtml&&looksLikeHtml(lang,raw)){
      fences.push(liveFrame?htmlFrame(raw):'<div class="dz-html-pending">'+svgIcon('sparkles',15)+' 正在生成可交互内容…</div>');
    }else{
      fences.push('<pre class="md-code"><code>'+escHtml(raw)+'</code></pre>');
    }
    return '\u0000FENCE'+(fences.length-1)+'\u0000';
  });
  var lines=src.split('\n'),html=[],para=[],listBuf=null,listType=null;
  function flushPara(){
    if(!para.length)return;
    var joined=para.join('\n');
    var body=allowHtml?joined:escHtml(joined);
    body=mdInline(body).replace(/\n/g,'<br>');
    html.push('<p>'+body+'</p>');
    para=[];
  }
  function flushList(){
    if(!listBuf)return;
    html.push('<'+listType+'>'+listBuf.map(function(it){
      var b=allowHtml?it:escHtml(it);return '<li>'+mdInline(b)+'</li>';
    }).join('')+'</'+listType+'>');
    listBuf=null;listType=null;
  }
  lines.forEach(function(ln){
    var fm=ln.match(/^\u0000FENCE(\d+)\u0000$/);
    if(fm){flushPara();flushList();html.push(fences[+fm[1]]);return;}
    // 若整行是 HTML 块标签，且允许 HTML，则原样输出
    if(allowHtml&&/^\s*<(\/?)(div|section|style|table|thead|tbody|tr|td|th|ul|ol|li|blockquote|h[1-6]|p|span|img|button|br|hr|figure|figcaption|pre|code)[\s>\/]/i.test(ln)){
      flushPara();flushList();html.push(ln);return;
    }
    if(/^\s*$/.test(ln)){flushPara();flushList();return;}
    var h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){flushPara();flushList();var lv=h[1].length;var b=allowHtml?h[2]:escHtml(h[2]);html.push('<h'+lv+'>'+mdInline(b)+'</h'+lv+'>');return;}
    if(/^\s*(---|\*\*\*|___)\s*$/.test(ln)){flushPara();flushList();html.push('<hr>');return;}
    var q=ln.match(/^\s*>\s?(.*)$/);
    if(q){flushPara();flushList();var qb=allowHtml?q[1]:escHtml(q[1]);html.push('<blockquote>'+mdInline(qb)+'</blockquote>');return;}
    var ul=ln.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){flushPara();if(listType!=='ul'){flushList();listType='ul';listBuf=[];}listBuf.push(ul[1]);return;}
    var ol=ln.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){flushPara();if(listType!=='ol'){flushList();listType='ol';listBuf=[];}listBuf.push(ol[1]);return;}
    flushList();para.push(ln);
  });
  flushPara();flushList();
  return html.join('');
}

/* 统一正文渲染管线：display 侧正则 → Markdown/HTML → 段落。
   liveFrame=true 时把 HTML 代码块渲染成真实 iframe（默认）；流式中途传 false 用占位 */
function renderStory(t,liveFrame){
  if(!t)return '<p>（无内容）</p>';
  if(liveFrame===undefined)liveFrame=true;
  var text=applyRegexScripts(t,'display');
  if(CONFIG.markdown){
    return markdownToHtml(text,!!CONFIG.renderHtml,liveFrame)||'<p>（无内容）</p>';
  }
  // 关闭 Markdown：仅按段落切分；renderHtml 决定是否转义
  return text.split(/\n{2,}|\n/).filter(function(l){return l.trim();}).map(function(l){
    return '<p>'+(CONFIG.renderHtml?l:escHtml(l))+'</p>';
  }).join('');
}
/* 纯文本正文 → HTML（保留旧名，走统一管线，默认 live 渲染 iframe） */
function textToHtml(t){return renderStory(t,true);}
/* 正则脚本持久化 */
function saveRegexScripts(){try{localStorage.setItem('dz_regex',JSON.stringify(REGEX_SCRIPTS));}catch(e){}}
function loadRegexScripts(){try{var s=localStorage.getItem('dz_regex');if(s)REGEX_SCRIPTS=JSON.parse(s)||[];}catch(e){REGEX_SCRIPTS=[];}}
loadRegexScripts();
/* 规范化单条脚本为内部格式（兼容 ST / 酒馆助手字段命名） */
function normalizeRegexScript(o){
  if(!o||typeof o!=='object')return null;
  var find=o.findRegex!=null?o.findRegex:(o.find_regex!=null?o.find_regex:'');
  if(!find)return null;
  return {
    scriptName:o.scriptName||o.script_name||o.name||'未命名脚本',
    findRegex:String(find),
    replaceString:(o.replaceString!=null?o.replaceString:(o.replace_string!=null?o.replace_string:'')),
    disabled:!!o.disabled,
    markdownOnly:!!o.markdownOnly,
    promptOnly:!!o.promptOnly,
    placement:Array.isArray(o.placement)?o.placement:[],
    id:o.id||('rgx_'+Date.now()+'_'+Math.floor(Math.random()*1e4))
  };
}
/* 从任意 JSON 结构中深度递归抽取正则脚本。
   兼容：角色卡 v3 的 regex_scripts、SillyTavern 预设的 RegexBinding.regexes、
   世界书条目 extensions.regex_scripts、酒馆助手脚本、纯数组等各种嵌套结构。
   判定标准：任何含 findRegex / find_regex 字段的对象都视为一条正则脚本。 */
function extractRegexArray(json){
  if(!json)return [];
  var found=[],seen=[];
  function isScript(o){return o&&typeof o==='object'&&!Array.isArray(o)&&(o.findRegex!=null||o.find_regex!=null);}
  function walk(node,depth){
    if(!node||typeof node!=='object'||depth>12)return;
    if(seen.indexOf(node)>=0)return;   // 防循环引用
    seen.push(node);
    if(Array.isArray(node)){
      node.forEach(function(it){
        if(isScript(it))found.push(it);
        else walk(it,depth+1);
      });
      return;
    }
    if(isScript(node)){found.push(node);return;}
    for(var k in node){if(Object.prototype.hasOwnProperty.call(node,k))walk(node[k],depth+1);}
  }
  walk(json,0);
  return found;
}
/* 导入：合并到现有脚本（按 id 去重，新脚本覆盖同 id 旧脚本） */
function importRegexList(arr,replace){
  var norm=[];
  (arr||[]).forEach(function(o){var n=normalizeRegexScript(o);if(n)norm.push(n);});
  if(!norm.length)return 0;
  if(replace){REGEX_SCRIPTS=norm;}
  else{
    var byId={};REGEX_SCRIPTS.forEach(function(s){byId[s.id]=s;});
    norm.forEach(function(s){byId[s.id]=s;});
    // 保持顺序：先已有后新增
    var seen={},merged=[];
    REGEX_SCRIPTS.concat(norm).forEach(function(s){if(!seen[s.id]){seen[s.id]=1;merged.push(byId[s.id]);}});
    REGEX_SCRIPTS=merged;
  }
  saveRegexScripts();
  return norm.length;
}
/* 从文件导入正则脚本（预设 JSON 或独立脚本 JSON） */
function importRegexFromFile(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var json=JSON.parse(rd.result);
        var arr=extractRegexArray(json);
        var n=importRegexList(arr,false);
        var r=document.getElementById('regex-import-result');
        if(r){r.className='set-test-result '+(n?'ok':'err');r.textContent=n?('✅ 已导入 '+n+' 条正则脚本'):'⚠️ 未在文件中找到正则脚本（regex_scripts / RegexBinding）';setTimeout(function(){r.className='set-test-result'},3000);}
        refreshRegexUI();
      }catch(e){
        var r2=document.getElementById('regex-import-result');
        if(r2){r2.className='set-test-result err';r2.textContent='❌ 解析失败：'+e.message;}
      }
    };
    rd.readAsText(f);
  };
  inp.click();
}
/* 导出为兼容 SillyTavern 的 JSON（含完整字段） */
function exportRegexScripts(){
  var out=REGEX_SCRIPTS.map(function(s){
    return {
      scriptName:s.scriptName,findRegex:s.findRegex,replaceString:s.replaceString,
      disabled:!!s.disabled,markdownOnly:!!s.markdownOnly,promptOnly:!!s.promptOnly,
      placement:s.placement||[],runOnEdit:true,substituteRegex:0,trimStrings:[],
      minDepth:null,maxDepth:null,id:s.id
    };
  });
  var blob=new Blob([JSON.stringify({regex_scripts:out},null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='regex_scripts.json';document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}
/* 启用/禁用、删除单条 */
function toggleRegexScript(idx){if(REGEX_SCRIPTS[idx]){REGEX_SCRIPTS[idx].disabled=!REGEX_SCRIPTS[idx].disabled;saveRegexScripts();refreshRegexUI();}}
function deleteRegexScript(idx){if(REGEX_SCRIPTS[idx]){REGEX_SCRIPTS.splice(idx,1);saveRegexScripts();refreshRegexUI();}}
function clearRegexScripts(){dzConfirm('确定清空全部正则脚本？',{tone:'danger',title:'清空正则脚本',okText:'清空'}).then(function(ok){if(ok){REGEX_SCRIPTS=[];saveRegexScripts();refreshRegexUI();}});}
/* 渲染正则脚本列表（注入到设置页容器） */
function renderRegexList(){
  if(!REGEX_SCRIPTS.length)return '<div style="font-size:12px;color:var(--text-3);padding:8px 0">暂无正则脚本。可从预设或独立 JSON 导入。</div>';
  return REGEX_SCRIPTS.map(function(s,i){
    var sides=[];if(!s.promptOnly)sides.push('显示');if(!s.markdownOnly)sides.push('提示');if(!sides.length)sides.push('—');
    return '<div class="regex-item'+(s.disabled?' off':'')+'">'+
      '<div class="regex-item-head">'+
        '<span class="regex-item-name">'+esc(s.scriptName)+'</span>'+
        '<div class="regex-item-ops">'+
          '<label class="switch mini"><input type="checkbox"'+(s.disabled?'':' checked')+' onchange="toggleRegexScript('+i+')"><span class="switch-track"></span></label>'+
          '<button class="regex-del" onclick="deleteRegexScript('+i+')" title="删除">'+svgIcon('trash',13)+'</button>'+
        '</div>'+
      '</div>'+
      '<div class="regex-item-meta">作用侧：'+sides.join(' / ')+'</div>'+
      '<div class="regex-item-find">'+esc(s.findRegex.length>60?s.findRegex.slice(0,60)+'…':s.findRegex)+'</div>'+
    '</div>';
  }).join('');
}
/* 刷新设置页里的正则列表容器（若正打开设置页） */
function refreshRegexUI(){var box=document.getElementById('regex-list-box');if(box)box.innerHTML=renderRegexList();}
/* 是否已配置可用 AI */
function aiReady(){return !!(CONFIG.apiKey&&CONFIG.model);}

document.addEventListener('DOMContentLoaded',function(){
  hydrateIcons();
  var intro=document.getElementById('intro-stage');
  var body=document.getElementById('narrative-body');
  var loading=document.getElementById('narrative-loading');
  var content=document.getElementById('narrative-content');
  var ci=document.getElementById('chat-input');
  var bs=document.getElementById('btn-send');
  var brb=document.getElementById('btn-rollback');
  var brt=document.getElementById('btn-retry');
  var wrap=document.getElementById('input-wrapper');
  var bcg=document.getElementById('btn-cancel-gen');
  var LAST_USER_MSG=null,LAST_LABEL=null,LAST_IS_CREATE=false;   // 供重试用

  /* 显示某段正文（替换当前显示），带淡入 */
  function showScene(html){
    body.style.display='block';
    body.innerHTML=html;
    body.querySelectorAll('p').forEach(function(p,i){p.style.animationDelay=(i*0.08)+'s'});
    content.scrollTop=0;
  }
  /* 解锁 / 锁定底部输入 */
  function setLocked(locked){
    if(locked){
      wrap.classList.add('locked');
      ci.setAttribute('readonly','');ci.setAttribute('disabled','');
      bs.disabled=true;
    }else{
      wrap.classList.remove('locked');
      ci.removeAttribute('readonly');ci.removeAttribute('disabled');
      bs.disabled=false;
      ci.placeholder='输入你的行动…';
    }
    refreshRollback();
  }
  /* 回滚/重试按钮可用性 */
  function refreshRollback(){
    brb.disabled=!(STORY.started && STORY.history.length>1);
    if(brt)brt.disabled=!(STORY.started && aiReady() && LAST_USER_MSG!==null);
  }
  /* 后文生成时显示/隐藏“停止”按钮（放输入框右侧）。生成中禁用回滚/重试避免竞态 */
  function showCancelGen(on){
    if(bcg)bcg.style.display=on?'flex':'none';
    if(on){if(brb)brb.disabled=true;if(brt)brt.disabled=true;}
    else{refreshRollback();}
  }
  /* 停止后文生成：中止请求，runAI 的 catch 会回退历史并恢复上一段 */
  function cancelGen(){
    if(!GEN_STATE.active)return;
    GEN_STATE.cancelled=true;
    if(CURRENT_AI_CTRL){try{CURRENT_AI_CTRL.abort();}catch(e){}CURRENT_AI_CTRL=null;}
  }
  if(bcg)bcg.addEventListener('click',cancelGen);
  /* 加载动画后回调；label 决定加载文字（创建中 / 生成中） */
  function withLoading(cb,label){
    var txt=label||'生成中';
    loading.innerHTML='';
    (txt+'…').split('').forEach(function(ch){
      var s=document.createElement('span');s.textContent=ch;loading.appendChild(s);
    });
    loading.style.display='flex';
    setLocked(true);
    setTimeout(function(){
      loading.style.display='none';
      cb();
      setLocked(false);
    },1400+Math.random()*700);
  }

  /* 流式请求 AI。
     isRetry=true：撤回上一轮回复重生成；
     isCreate=true：徒弟创建（全屏锁 + 字符进度），仅由 startStoryWithSetup 显式传入。 */
  function runAI(userMsg,label,isRetry,isCreate){
    isCreate=!!isCreate;
    // 快照：用于"取消/停止"时把历史干净回退到本轮之前
    var snapChat=CHAT_HISTORY.slice();
    var snapStoryLen=STORY.history.length;
    var snapHistory=captureHistoryRollbackState();
    var snapLastMsg=LAST_USER_MSG,snapLastLabel=LAST_LABEL,snapLastIsCreate=LAST_IS_CREATE;
    if(isRetry){
      var retryHistorySnapshot=STORY.historySnapshots&&STORY.historySnapshots.length?STORY.historySnapshots.pop():null;
      if(retryHistorySnapshot){restoreHistoryRollbackState(retryHistorySnapshot,true);snapHistory=retryHistorySnapshot;}
      // 撤回上一轮 assistant 回复 + 对应正文历史（仅当上轮成功过）
      if(CHAT_HISTORY.length&&CHAT_HISTORY[CHAT_HISTORY.length-1].role==='assistant'){
        CHAT_HISTORY.pop();
        if(STORY.history.length>0)STORY.history.pop();
      }
      // 若末尾是 user（上轮失败），直接复用该 user 消息重发，不动 history
    }else{
      LAST_USER_MSG=userMsg;LAST_LABEL=label||null;LAST_IS_CREATE=!!isCreate;
      CHAT_HISTORY.push({role:'user',content:userMsg});
    }
    setLocked(true);
    var connectLabel=label||'生成中';
    // 创建模式：全屏灰色锁屏 + 字符进度；后文生成：内联加载点 + 输入框右侧“停止”按钮
    if(isCreate){
      CREATE_STATE.active=true;CREATE_STATE.cancelled=false;
      setCreateProgress(0);
      showCreateLock('正在从诸天万界匹配她……');
    }else{
      GEN_STATE.active=true;GEN_STATE.cancelled=false;
      showCancelGen(true);
    }
    function setLoadingText(txt){loading.innerHTML='';(txt+'…').split('').forEach(function(ch){var s=document.createElement('span');s.textContent=ch;loading.appendChild(s);});}
    if(!isCreate){setLoadingText(connectLabel);loading.style.display='flex';showGenStatus('正在对接中…',false);}
    setApiStatus(1,'connecting');
    body.style.display='block';
    var messages=[{role:'system',content:buildSystemPrompt(userMsg)}].concat(recentHistoryWindow());
    var acc='';
    var outputStarted=false,connected=false;
    // 首字节到达前：120秒硬超时兜底；连接成功或输出开始即清除（不再倒计时截断）
    var hardTimer=null;
    var timeout=new Promise(function(_,rej){hardTimer=setTimeout(function(){rej(new Error('请求超时（120秒无响应）。可能是网络问题或 API 无响应，请点重试。'));},120000);});
    // 创建流程强制流式（字符计数需要增量）；后文生成尊重 CONFIG.stream，非流式也完整适配
    AI_FORCE_STREAM=isCreate?true:false;
    function stopCountdown(){if(hardTimer){clearTimeout(hardTimer);hardTimer=null;}}
    function onConnected(){
      // 与目标路由对接成功：停止报错倒计时，进入“生成中”
      connected=true;stopCountdown();
      setApiStatus(1,'updating');
      if(isCreate){showCreateLock('已成功对接，正在生成……');}
      else{setLoadingText('生成中');showGenStatus('正在生成中…',false);}
    }
    function onDelta(delta){
      if(!outputStarted){outputStarted=true;stopCountdown();}
      acc+=delta;
      if(isCreate){
        // 创建模式锁屏遮挡正文，只更新“当前字符数”进度
        var clen=acc.replace(/<状态>[\s\S]*?(<\/状态>|$)/g,'').replace(/<History>[\s\S]*?(<\/History>|$)/gi,'').length;
        setCreateProgress(clen);
        return;
      }
      var shown=acc.replace(/<状态>[\s\S]*?(<\/状态>|$)/g,'').replace(/<History>[\s\S]*?(<\/History>|$)/gi,'');
      loading.style.display='none';
      body.innerHTML=renderStory(shown,false);   // 流式中途：HTML 代码块用占位，避免 iframe 反复重载
      content.scrollTop=content.scrollHeight;
    }
    return Promise.race([callAI(messages,onDelta,onConnected),timeout]).then(function(full){
      AI_FORCE_STREAM=false;CURRENT_AI_CTRL=null;
      stopCountdown();
      // 被取消：丢弃结果
      if(isCreate&&CREATE_STATE.cancelled){CREATE_STATE.active=false;return;}
      if(!isCreate&&GEN_STATE.cancelled){GEN_STATE.active=false;return;}
      if(isCreate){CREATE_STATE.active=false;setCreateProgress(0);hideCreateLock();}
      else{GEN_STATE.active=false;showCancelGen(false);showGenStatus('生成完毕',true);setApiStatus(1,'done');}
      loading.style.display='none';
      // 非流式：此时 body 还没内容，用 full 一次性渲染
      // 先解析隐藏的 DZDB / History 块，只把纯正文留在短期上下文，避免重复消耗 token。
      var clean=stripAndParseState(full);
      CHAT_HISTORY.push({role:'assistant',content:clean});
      archiveHistoryMessages();
      var html=textToHtml(clean);
      STORY.history.push(html);
      if(!Array.isArray(STORY.historySnapshots))STORY.historySnapshots=[];
      STORY.historySnapshots.push(snapHistory);
      showScene(html);
      refreshAll();                              // 刷新场景头标/面板/存档
      setLocked(false);
      // 正文生成完毕：若手机页正开着，补触发一次后台更新（生成期间被跳过了）
      var fp=document.getElementById('fullpage');
      if(fp&&fp.classList.contains('open')&&PHONE_PAGES[fp.dataset.page]&&STATE.disciple.name)refreshPhone(fp.dataset.page);
    }).catch(function(e){
      AI_FORCE_STREAM=false;CURRENT_AI_CTRL=null;
      stopCountdown();
      // 用户主动停止后文生成：回退历史到本轮之前，恢复上一段，静默返回
      if(!isCreate&&(GEN_STATE.cancelled||(e&&e.userCancelled))){
        GEN_STATE.active=false;showCancelGen(false);hideGenStatus();
        CHAT_HISTORY=snapChat;LAST_USER_MSG=snapLastMsg;LAST_LABEL=snapLastLabel;LAST_IS_CREATE=snapLastIsCreate;
        while(STORY.history.length>snapStoryLen)STORY.history.pop();
        while(STORY.historySnapshots.length>snapStoryLen)STORY.historySnapshots.pop();
        restoreHistoryRollbackState(snapHistory,false);
        loading.style.display='none';
        if(STORY.history.length)showScene(STORY.history[STORY.history.length-1]);
        setLocked(false);refreshRollback();
        return;
      }
      // 创建被取消：由 cancelCreate 处理善后，这里直接退出
      if(isCreate&&(CREATE_STATE.cancelled||(e&&e.userCancelled))){CREATE_STATE.active=false;return;}
      if(isCreate){CREATE_STATE.active=false;setCreateProgress(0);hideCreateLock();}
      else{GEN_STATE.active=false;showCancelGen(false);hideGenStatus();}
      loading.style.display='none';
      // 失败也进主页面，显示报错信息
      body.style.display='block';
      body.innerHTML=textToHtml('⚠️ AI 调用失败：'+e.message+'\n\n请到「设置」检查 API 配置，然后在下方重试或返回主菜单重新收徒。');
      setApiStatus(1,'fail','生成失败');
      setLocked(false);
    });
  }

  /* 暴露给收徒页：确认收徒后真正开始（必须先配置 API） */
  window.startStoryWithSetup=function(setup){
    if(STORY.started)return;
    if(!aiReady()){
      dzAlert('请先在「设置」中配置 API（协议、API Key、模型名），本作全程由 AI 实时生成，无示例回退。',{tone:'warn'});
      openPage('modal-settings');
      return;
    }
    // 进入主页面（隐藏初始界面），随后弹出创建锁屏
    hideStartup();
    STORY.started=true;
    intro.style.display='none';
    runAI(setup,'创建中',false,true);
  };
  /* 取消创建：丢弃本轮生成，回退存档槽，返回初始界面 */
  window.cancelCreate=function(){
    if(!CREATE_STATE.active)return;
    CREATE_STATE.cancelled=true;
    CREATE_STATE.active=false;
    if(CURRENT_AI_CTRL){try{CURRENT_AI_CTRL.abort();}catch(e){}CURRENT_AI_CTRL=null;}   // 中止进行中的请求
    setCreateProgress(0);
    hideCreateLock();
    // 回退：本次未生成成功，删除刚建的空存档槽
    if(CUR_SLOT){deleteSlot(CUR_SLOT);}
    STORY.started=false;STORY.history=[];STORY.historySnapshots=[];CHAT_HISTORY=[];
    setLocked(true);
    showStartup();
  };

  /* 发送行动（必须已配置 API） */
  function sendAction(){
    if(!STORY.started)return;
    var t=ci.value.trim();
    if(!t)return;
    if(!aiReady()){dzAlert('请先在「设置」中配置 API。',{tone:'warn'});openPage('modal-settings');return;}
    ci.value='';ci.style.height='auto';
    runAI(t);
  }
  /* 暴露：手机内的触摸/送礼/购买等行动统一走主通道生成一回合 */
  window.sendGameAction=function(actionText,label){
    if(!STORY.started){dzAlert('请先「开始收徒」进入剧情后再进行互动。',{tone:'warn'});return;}
    if(!aiReady()){dzAlert('请先在「设置」中配置 API。',{tone:'warn'});return;}
    runAI(actionText,label||'生成中');
  };
  if(ci){
    ci.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,96)+'px'});
    ci.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAction()}});
  }
  if(bs)bs.addEventListener('click',sendAction);

  /* 回滚：弹出栈顶，显示上一段（带确认） */
  if(brb){
    brb.addEventListener('click',function(){
      if(STORY.history.length<2)return;
      dzConfirm('确定回滚到上一段剧情吗？当前这一段将被丢弃。',{tone:'warn',title:'回滚剧情',okText:'回滚'}).then(function(ok){
      if(!ok)return;
      STORY.history.pop();
      var rollbackHistorySnapshot=STORY.historySnapshots&&STORY.historySnapshots.length?STORY.historySnapshots.pop():null;
      if(rollbackHistorySnapshot)restoreHistoryRollbackState(rollbackHistorySnapshot,true);
      if(CHAT_HISTORY.length&&CHAT_HISTORY[CHAT_HISTORY.length-1].role==='assistant')CHAT_HISTORY.pop();
      if(CHAT_HISTORY.length&&CHAT_HISTORY[CHAT_HISTORY.length-1].role==='user')CHAT_HISTORY.pop();
      showScene(STORY.history[STORY.history.length-1]);
      refreshAll();refreshRollback();
      });
    });
  }

  /* 重试：撤回上一轮回复，用相同的 user 输入重新生成（带确认） */
  if(brt){
    brt.addEventListener('click',function(){
      if(!STORY.started||!aiReady()||LAST_USER_MSG===null)return;
      dzConfirm('确定重新生成这一段吗？当前内容将被新的输出替换。',{tone:'warn',title:'重新生成',okText:'重新生成'}).then(function(ok){
      if(!ok)return;
      runAI(LAST_USER_MSG,LAST_LABEL||'重新生成',true,LAST_IS_CREATE);
      });
    });
  }

  /* 暴露给初始界面：恢复某个存档进主页面 */
  window.enterMainWithSave=function(story){
    hideStartup();
    if(story&&story.started&&story.history&&story.history.length){
      STORY.started=true;STORY.history=story.history;STORY.historySnapshots=Array.isArray(story.historySnapshots)?story.historySnapshots:[];STORY.day=story.day||1;
      intro.style.display='none';
      showScene(STORY.history[STORY.history.length-1]);
      setLocked(false);
      // 从恢复的 CHAT_HISTORY 中重建 LAST_USER_MSG，让重试按钮可用
      for(var _i=CHAT_HISTORY.length-1;_i>=0;_i--){
        if(CHAT_HISTORY[_i].role==='user'){
          LAST_USER_MSG=CHAT_HISTORY[_i].content;
          LAST_LABEL='重新生成';
          LAST_IS_CREATE=false;
          break;
        }
      }
    }
    refreshAll();
  };

  /* ---- 初始化：停留在初始界面，等待用户选择 ---- */
  refreshAll();
  // 若上次有正在进行的存档，初始界面「存档查看」中可见并载入
});
</script>
